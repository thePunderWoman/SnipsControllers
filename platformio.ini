; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32s3

; Custom board built around a bare ESP32-S3-WROOM-1 module (see
; PCB/GPIO_table.md), not a vendor dev board. "esp32-s3-devkitc-1" is the
; closest board def in the espressif32 platform's registry — it targets
; the same module with the same default flash/PSRAM config, so it's the
; standard stand-in for a custom WROOM-1 design in PlatformIO.
[env:esp32s3]
; Pinned to the exact version already resolving here rather than the bare
; floating "espressif32" name — an unversioned platform name is a single
; shared cache slot on this machine, so unrelated ESP32 work elsewhere can
; silently replace it out from under this project (same reasoning
; thePunderWoman/Amidala's platformio.ini documents for its own pin).
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; This board has no external USB-UART bridge chip (bare WROOM-1 module,
; see PCB/GPIO_table.md) — Serial has to go over the ESP32-S3's native USB
; peripheral, the same port used for flashing. The board def enables that
; peripheral (ARDUINO_USB_MODE=1) but doesn't turn Serial itself onto it by
; default, so without this flag Serial silently goes to UART0's physical
; pins instead (unconnected on this board) and the monitor shows nothing,
; even though the firmware is running fine.
build_flags = -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
	adafruit/Adafruit SSD1306@^2.5.13
	adafruit/Adafruit GFX Library@^1.11.11
	adafruit/Adafruit NeoPixel@^1.15.4
extra_scripts = pre:scripts/firmware_version.py

; Native (host) environment for unit tests — no hardware required.
; SnipsController.ino pulls in Arduino.h, so it's excluded here; everything
; else in src/ is hardware-agnostic and gets linked into the test binary,
; EXCEPT a small, explicitly-named list of genuinely hardware-touching
; adapter files (thin wrappers over I2C/SPI/ADC/RMT/NVS), added here
; alongside as new subsystems land — see CLAUDE.md's testing-approach note.
; Currently: oled.cpp (Adafruit_SSD1306/Wire), rgb_led.cpp
; (Adafruit_NeoPixel/RMT), calibration_store.cpp, droid_persistence.cpp,
; and complication_persistence.cpp (all Preferences/NVS), xbee_spi.cpp
; (SPI) and xbee_control.cpp (calls through to XbeeSpi, hardware-dependent
; now that it's a real transport rather than a stub).
[env:native]
platform = native
test_build_src = yes
build_src_filter = +<*> -<*.ino> -<oled.cpp> -<rgb_led.cpp> -<calibration_store.cpp> -<droid_persistence.cpp> -<xbee_spi.cpp> -<xbee_control.cpp> -<complication_persistence.cpp> -<accelerometer.cpp> -<power_config_store.cpp>
test_framework = unity
build_flags = --coverage
extra_scripts = pre:scripts/native_coverage_linkflags.py
