project:
  name: Snips Controller
  revision: 0.1
  description: >
    Wireless handheld R2-D2 controller (Snips Controller). Bare RP2350A MCU
    (custom USB-C + Murata Type 1YN WiFi/BT module, not a Pico 2 W module —
    see MCU_Core/Wireless sections), XBee3 Zigbee radio over SPI1, hall
    effect thumbstick and analog trigger, SSD1306 OLED display, WS2812 RGB
    LED, embedded bq25185 charger + TLV62569 3.3V buck, swappable
    single-cell Li-ion battery, soft-latch power control.

# ---------------------------------------------------------------------------
# NET LEGEND
# ---------------------------------------------------------------------------
# VBUS        - 5V USB input from USB-C connector
# VSYS        - Battery/charger system output (bq25185 SYS pin), ~3.7-4.5V
# 3V3         - Regulated 3.3V output from TLV62569 buck
# GND         - Ground
# VBAT        - Battery positive terminal
# USB_DP      - USB D+ data line
# USB_DM      - USB D- data line
# I2C_SDA     - I2C0 data (GP4) — OLED
# I2C_SCL     - I2C0 clock (GP5) — OLED
# SPI_SCK     - XBee SPI1 clock (GP10)
# SPI_MOSI    - XBee SPI1 MOSI (GP11)
# SPI_MISO    - XBee SPI1 MISO (GP12)
# XBee_CS     - XBee SPI1 chip select (GP13)
# XBEE_ON_SLEEP - XBee ON/~SLEEP status, host input (GP17)
# XBEE_SPI_ATTN - XBee SPI data-ready interrupt (GP18)
# TRIG_ANALOG - Analog trigger output from DRV5055 (GP26/ADC0)
# STICK_X     - Thumbstick X axis (GP27/ADC1)
# STICK_Y     - Thumbstick Y axis (GP28/ADC2)
# STAT1       - bq25185 charge status pin 1 (open-drain, GP20)
# RGB_DIN     - WS2812 NeoPixel data in (GP22, PIO-driven)
# PWR_EN      - TLV62569 EN signal, driven by soft latch PFET drain
# PWR_GATE    - PFET gate node (pulled HIGH by default = off)
# PWR_LATCH_G - NFET latch gate (driven by button OR GP21)
# PWR_HOLD    - GP21 output to OR diode, holds latch after boot
# GP15_SENSE  - Power button junction: R_BTN_PU/R_PWR_SENSE divider
#               midpoint, pulled to VSYS, button pulls to GND, feeds GP15
# BTN_*       - Individual button nets (pulled up internally, wired to GND)
# MAT_R*      - Matrix row drive lines (GP6/GP7, driven LOW to scan)
# MAT_C*      - Matrix column sense lines (GP8/GP9/GP14, internal pull-ups)
# WL_CLK/WL_D/WL_CS - Bit-banged 3-wire interface to the Murata Type 1YN
#               wireless module (GP24/GP23/GP25), matches Pico 2 W's own
#               RP2350<->CYW43439 wiring so the existing pico-sdk cyw43 PIO
#               driver applies unmodified
# WL_ON       - Enables both WL_REG_ON and BT_REG_ON on the wireless module (GP16)
# MCU_1V1     - RP2350 internal core rail, externally filtered (VREG_LX/FB)
# MCU_ADC_AVDD- Filtered analog supply for RP2350's ADC_AVDD pin
# VSYS_SENSE  - Divide-by-3 VSYS sense into GP29/ADC3 (R_VSYS1/R_VSYS2),
#               replaces the Pico 2 W module's onboard divider

# ---------------------------------------------------------------------------
# RESERVED GPIO — DO NOT USE
# ---------------------------------------------------------------------------
# GP16: WL_ON  - wireless module WL_REG_ON + BT_REG_ON enable (shared)
# GP23: WL_D   - wireless module bit-banged data bus (see Wireless section)
# GP24: WL_CLK - wireless module bit-banged clock
# GP25: WL_CS  - wireless module bit-banged chip select
# GP29: VSYS_SENSE - divide-by-3 battery voltage sense (ADC3), replaces
#       the Pico 2 W module's onboard VSYS divider (see R_VSYS1/R_VSYS2
#       in MCU_Core)
#
# GP17: XBee ON_SLEEP status input (host GPIO per Amidala's netlist)
# GP18: XBee SPI_ATTN — data-ready interrupt from XBee, needed for SPI mode
# GP19 is free for future use.

# ---------------------------------------------------------------------------
groups:

  # -------------------------------------------------------------------------
  # 1. USB-C Connector
  # -------------------------------------------------------------------------
  # USB 2.0 only. CC resistors required for USB-C power negotiation.
  # VBUS -> bq25185 VIN. D+/D- -> Pico 2 W USB data pins.
  # SHIELD -> GND.
  # USB_DP/USB_DM run from the connector through the 27R series resistors in
  # MCU_Core (R_USB_DP/R_USB_DM, per RP2350 reference design) to the bare
  # RP2350's own USB_DP/USB_DM pins. This connector's data lines were
  # formerly (incorrectly) routed to a Pico 2 W module, which does not
  # expose USB D+/D- as header pins — see MCU_Core section for the fix.
  USB_C:
    components:
      J_USB:
        symbol: Connector:USB_C_Receptacle_USB2.0_16P
        sheet: USB_C
        value: USB-C
        footprint: Connector_USB:USB_C_Receptacle_HRO_TYPE-C-31-M-12
      R_CC1:
        symbol: Device:R
        sheet: USB_C
        value: 5.1kΩ
        footprint: Resistor_SMD:R_0402_1005Metric
      R_CC2:
        symbol: Device:R
        sheet: USB_C
        value: 5.1kΩ
        footprint: Resistor_SMD:R_0402_1005Metric
    connections:
      # USB-C receptacle duplicates VBUS/GND/D+/D- across the A and B rows
      # for cable-flip support — both instances of each must be tied
      # together (standard USB2-only practice: no orientation mux needed).
      # Name-based pin lookup only resolves the first match, so the B-row
      # duplicates are addressed explicitly by pin number.
      - net: VBUS
        global: true
        pins: [J_USB:VBUS,
               J_USB:A9,
               J_USB:B4,
               J_USB:B9,
               U_CHG:IN,
               C_VIN_1:1,
               C_VIN_2:1]
      - net: USB_DP
        pins: [J_USB:D+, J_USB:B6, R_USB_DP:1]
      - net: USB_DM
        pins: [J_USB:D-, J_USB:B7, R_USB_DM:1]
      - net: GND
        pins: [J_USB:GND, J_USB:A12, J_USB:B1, J_USB:B12, J_USB:SHIELD,
               R_CC1:2, R_CC2:2]
      - net: USB_CC1
        pins: [J_USB:CC1, R_CC1:1]
      - net: USB_CC2
        pins: [J_USB:CC2, R_CC2:1]
      # SBU1/SBU2 (DisplayPort Alt Mode sideband) unused — USB 2.0 only
      - no_connect: [J_USB:A8, J_USB:B8]

  # -------------------------------------------------------------------------
  # 2. bq25185 Battery Charger + Power Path
  # -------------------------------------------------------------------------
  # VIN    <- VBUS (5V USB)
  # SYS    -> VSYS rail
  # BAT    <-> VBAT
  # STAT1  -> GP20 (open-drain, 10kΩ pull-up to 3V3)
  # STAT2  -> not connected (left floating)
  # ISET   -> R_ISET to GND. ICHG = 300 AΩ / RISET.
  #           RISET = 600Ω -> ~500mA charge current
  # ILIM/VSET -> R_VSET = 18kΩ -> 4.2V VBATREG, 500mA input limit
  #           (per Table 7-1 in bq25185 datasheet)
  # TS/MR  -> R_TS = 10kΩ to GND (REQUIRED if no thermistor)
  # CE     -> GND (always enable charging)
  # Decoupling: 10µF + 100nF on VIN; 10µF + 100nF on SYS; 10µF on BAT
  # Use X7R/X5R ceramic, 25V rated on VIN and SYS pins
  Power_Charger:
    components:
      U_CHG:
        symbol: BQ25185DLHR:BQ25185DLHR
        sheet: Power_Charger
        value: bq25185
        footprint: BQ25185DLHR:IC_BQ25185DLHR
      C_VIN_1:
        symbol: Device:C
        sheet: Power_Charger
        value: 10µF
        footprint: Capacitor_SMD:C_0805_2012Metric
      C_VIN_2:
        symbol: Device:C
        sheet: Power_Charger
        value: 100nF
        footprint: Capacitor_SMD:C_0402_1005Metric
      C_SYS_1:
        symbol: Device:C
        sheet: Power_Charger
        value: 10µF
        footprint: Capacitor_SMD:C_0805_2012Metric
      C_SYS_2:
        symbol: Device:C
        sheet: Power_Charger
        value: 100nF
        footprint: Capacitor_SMD:C_0402_1005Metric
      C_BAT:
        symbol: Device:C
        sheet: Power_Charger
        value: 10µF
        footprint: Capacitor_SMD:C_0805_2012Metric
      R_ISET:
        symbol: Device:R
        sheet: Power_Charger
        value: 600Ω
        footprint: Resistor_SMD:R_0402_1005Metric
      R_VSET:
        symbol: Device:R
        sheet: Power_Charger
        value: 18kΩ
        footprint: Resistor_SMD:R_0402_1005Metric
      R_TS:
        symbol: Device:R
        sheet: Power_Charger
        value: 10kΩ
        footprint: Resistor_SMD:R_0402_1005Metric
      R_STAT1:
        symbol: Device:R
        sheet: Power_Charger
        value: 10kΩ
        footprint: Resistor_SMD:R_0402_1005Metric
    connections:
      - net: VSYS
        global: true
        pins: [U_CHG:SYS,
               C_SYS_1:1,
               C_SYS_2:1,
               U_BUCK:VIN,
               C_BUCK_IN:1,
               Q_PWR:S,
               R_GATE:1,
               R_BTN_PU:1,
               R_VSYS1:1,
               PF_VSYS:1]
      - net: VBAT
        pins: [U_CHG:BAT, C_BAT:1]
      - net: STAT1
        pins: [U_CHG:STAT1, R_STAT1:1, U_MCU:GPIO20]
      - net: 3V3
        pins: [R_STAT1:2]
      - net: GND
        pins: [U_CHG:GND, C_VIN_1:2, C_VIN_2:2, C_SYS_1:2, C_SYS_2:2,
               C_BAT:2, R_ISET:2, R_VSET:2, R_TS:2, "U_CHG:~{CE}",
               U_CHG:THERMAL_PAD]
      - net: CHG_ISET
        pins: [U_CHG:ISET, R_ISET:1]
      - net: CHG_VSET
        pins: [U_CHG:ILIM/VSET, R_VSET:1]
      - net: CHG_TS
        pins: [U_CHG:TS/MR, R_TS:1]
      # STAT2 left floating (not connected)
      - no_connect: [U_CHG:STAT2]

  # -------------------------------------------------------------------------
  # 3. TLV62569 3.3V Buck Converter
  # -------------------------------------------------------------------------
  # VIN    <- VSYS
  # VOUT   -> 3V3
  # EN     -> PWR_EN (soft latch power control, NOT tied to 3V3 directly)
  # FB     -> R_FB1/R_FB2 divider sets 3.3V output
  #           VOUT = 0.6V * (1 + R_FB1/R_FB2)
  #           R_FB1=100kΩ, R_FB2=56.2kΩ -> ~3.31V (verify with 1% resistors)
  # L      - 1µH, >=2A rating, low DCR
  # Decoupling: 10µF on VIN, 22µF on VOUT
  Power_Buck:
    components:
      U_BUCK:
        symbol: Regulator_Switching:TLV62569DBV
        sheet: Power_Buck
        value: TLV62569
        footprint: Package_TO_SOT_SMD:SOT-23-5
      L_BUCK:
        symbol: Device:L
        sheet: Power_Buck
        value: 1µH
        footprint: Inductor_SMD:L_Bourns_SRR1260
      C_BUCK_IN:
        symbol: Device:C
        sheet: Power_Buck
        value: 10µF
        footprint: Capacitor_SMD:C_0805_2012Metric
      C_BUCK_OUT:
        symbol: Device:C
        sheet: Power_Buck
        value: 22µF
        footprint: Capacitor_SMD:C_0805_2012Metric
      R_FB1:
        symbol: Device:R
        sheet: Power_Buck
        value: 100kΩ
        footprint: Resistor_SMD:R_0402_1005Metric
      R_FB2:
        symbol: Device:R
        sheet: Power_Buck
        value: 56.2kΩ
        footprint: Resistor_SMD:R_0402_1005Metric
    connections:
      - net: PWR_EN
        pins: [U_BUCK:EN, Q_PWR:D]
      - net: BUCK_SW
        pins: [U_BUCK:SW, L_BUCK:1]
      - net: 3V3
        pins: [L_BUCK:2, C_BUCK_OUT:1, R_FB1:2]
      - net: BUCK_FB
        pins: [U_BUCK:FB, R_FB1:1, R_FB2:1]
      - net: GND
        pins: [U_BUCK:GND, C_BUCK_IN:2, C_BUCK_OUT:2, R_FB2:2]

  # -------------------------------------------------------------------------
  # 4. Battery Holder
  # -------------------------------------------------------------------------
  # Single cell Li-ion (18650 or 14500 — to be determined empirically)
  Battery:
    components:
      BT1:
        symbol: Device:Battery
        sheet: Battery
        value: Li-ion_18650_or_14500
        footprint: Battery:BatteryHolder_Keystone_1042_1x18650
    connections:
      - net: VBAT
        pins: [BT1:+]
      - net: GND
        pins: [BT1:-]

  # -------------------------------------------------------------------------
  # 5. Power Control Circuit (soft latch, hybrid hardware+firmware)
  # -------------------------------------------------------------------------
  # Boot (hardware):
  #   EN pulled LOW by default (off). Press PWR button -> D_OR1 drives
  #   Q_LATCH gate HIGH -> Q_LATCH on -> Q_PWR gate pulled LOW -> PWR_EN HIGH
  #   -> TLV62569 EN HIGH -> 3V3 up -> Pico boots.
  #   Firmware drives GP21 HIGH immediately on boot to hold latch via D_OR2.
  #
  # Shutdown (firmware):
  #   Firmware monitors PWR button on GP15 (3-second hold).
  #   On shutdown: drive GP21 LOW -> Q_LATCH off -> R_GATE pulls Q_PWR gate
  #   HIGH -> PWR_EN LOW -> 3V3 cut.
  #
  # CRITICAL: GP21 must be driven HIGH as the very first instruction in
  # firmware or power cuts when user releases the power button.
  #
  # PWR_BTN_NODE pulled to VSYS via R_BTN_PU. R_PWR_SENSE (100kΩ to GND)
  # divides with R_BTN_PU (100kΩ) giving ~2.1V at GP15 when idle (HIGH).
  # Button press pulls to GND; GP15 reads LOW. 2.1V safe within 3.3V limit.
  Power_Control:
    components:
      Q_PWR:
        symbol: Transistor_FET:Q_PMOS_GSD
        sheet: Power_Control
        value: DMG2305UX
        footprint: Package_TO_SOT_SMD:SOT-23
      Q_LATCH:
        symbol: Transistor_FET:Q_NMOS_GSD
        sheet: Power_Control
        value: 2N7002
        footprint: Package_TO_SOT_SMD:SOT-23
      D_OR1:
        symbol: Device:D_Small
        sheet: Power_Control
        value: 1N4148W
        footprint: Package_TO_SOT_SMD:SOT-23
      D_OR2:
        symbol: Device:D_Small
        sheet: Power_Control
        value: 1N4148W
        footprint: Package_TO_SOT_SMD:SOT-23
      R_GATE:
        symbol: Device:R
        sheet: Power_Control
        value: 100kΩ
        footprint: Resistor_SMD:R_0402_1005Metric
      R_BTN_PU:
        symbol: Device:R
        sheet: Power_Control
        value: 100kΩ
        footprint: Resistor_SMD:R_0402_1005Metric
      R_PWR_SENSE:
        symbol: Device:R
        sheet: Power_Control
        value: 100kΩ
        footprint: Resistor_SMD:R_0402_1005Metric
      R_LATCH_G:
        symbol: Device:R
        sheet: Power_Control
        value: 10kΩ
        footprint: Resistor_SMD:R_0402_1005Metric
      C_DBNC:
        symbol: Device:C
        sheet: Power_Control
        value: 100nF
        footprint: Capacitor_SMD:C_0402_1005Metric
      SW_PWR:
        symbol: Switch:SW_Push
        sheet: Power_Control
        value: Omron_B3F
        footprint: Button_Switch_THT:SW_PUSH_6mm
    connections:
      - net: PWR_GATE
        pins: [Q_PWR:G, R_GATE:2, Q_LATCH:D]
      - net: PWR_LATCH_G
        pins: [Q_LATCH:G, R_LATCH_G:2, D_OR1:K, D_OR2:K]
      - net: GND
        pins: [Q_LATCH:S, R_LATCH_G:1, C_DBNC:2, SW_PWR:2]
      # PWR_BTN_NODE and GP15_SENSE are the same physical node (R_BTN_PU/
      # R_PWR_SENSE divider midpoint, also where the button pulls to GND) —
      # standardized on one label (GP15_SENSE) to avoid an ERC ambiguous-
      # net-name warning.
      - net: GP15_SENSE
        pins: [SW_PWR:1, R_BTN_PU:2, C_DBNC:1, D_OR1:A, R_PWR_SENSE:1, U_MCU:GPIO15]
      - net: GND
        pins: [R_PWR_SENSE:2]
      - net: PWR_HOLD
        pins: [D_OR2:A, U_MCU:GPIO21]

  # -------------------------------------------------------------------------
  # 6. Bare RP2350A + external flash/crystal/USB/core-regulator
  # -------------------------------------------------------------------------
  # Bare RP2350A (QFN-60) instead of the Pico 2 W module, so USB_DP/USB_DM
  # and the wireless interface can be wired to our own external USB-C
  # connector and a separate pre-certified wireless module. Everything
  # below (flash, crystal, VREG LC filter, USB series resistors, BOOTSEL,
  # decoupling) replicates the official Pico 2 W reference schematic
  # (RPI-PICO2W, sheet 1) for the RP2350 portion, since our own bq25185 +
  # TLV62569 already supplies 3V3 — the Pico 2 W's own onboard buck-boost
  # regulator (which exists only to generate 3V3 for the module itself)
  # is not needed.
  #
  # IOVDD/DVDD both have several physically separate pins on the QFN-60
  # package that all happen to share the same pin *name* — kicaddy resolves
  # a bare pin name to only the first matching pin, so the rest are
  # addressed explicitly by pin number below (still the same electrical
  # net, just multiple physical attachment points for decoupling).
  MCU_Core:
    components:
      U_MCU:
        symbol: MCU_RaspberryPi:RP2350A
        sheet: MCU_Core
        value: RP2350A0A2
        footprint: Package_DFN_QFN:QFN-60-1EP_7x7mm_P0.4mm_EP3.4x3.4mm
      U_FLASH:
        symbol: Memory_Flash:W25Q32JVSS
        sheet: MCU_Core
        value: W25Q32RVXHJQ
        # NOTE: JVSS above is the closest stock pin-compatible symbol
        # (same 8-pin QSPI flash pinout, pin numbers match the real
        # footprint below 1:1). Footprint sourced from Ultra Librarian
        # (nominal/IPC-standard land pattern for the real XSON-8 2x3mm
        # RVXHJQ package). Its exposed thermal pad (pad 9) has no
        # corresponding pin on the JVSS symbol — tie it to GND directly
        # in the PCB editor during layout, not through the schematic.
        footprint: SnipsControllers:XSON8_XH_2x3x0p4_WIN
      X1:
        symbol: Device:Crystal
        sheet: MCU_Core
        value: 12MHz
        footprint: Crystal_SMD:Crystal_SMD_3225-4Pin_3.2x2.5mm
      C16:
        symbol: Device:C
        sheet: MCU_Core
        value: 15pF
        footprint: Capacitor_SMD:C_0402_1005Metric
      C17:
        symbol: Device:C
        sheet: MCU_Core
        value: 15pF
        footprint: Capacitor_SMD:C_0402_1005Metric
      SW_BOOTSEL:
        symbol: Switch:SW_Push
        sheet: MCU_Core
        value: TP-1221U-K9K5325
        footprint: Button_Switch_SMD:SW_SPST_TL3342
      R11:
        symbol: Device:R
        sheet: MCU_Core
        value: 1kΩ
        footprint: Resistor_SMD:R_0402_1005Metric
      R_USB_DP:
        symbol: Device:R
        sheet: MCU_Core
        value: 27Ω
        footprint: Resistor_SMD:R_0402_1005Metric
      R_USB_DM:
        symbol: Device:R
        sheet: MCU_Core
        value: 27Ω
        footprint: Resistor_SMD:R_0402_1005Metric
      L_VREG:
        symbol: Device:L
        sheet: MCU_Core
        value: 3.3µH
        footprint: Inductor_SMD:L_0603_1608Metric
      C_VREG_1:
        symbol: Device:C
        sheet: MCU_Core
        value: 4.7µF
        footprint: Capacitor_SMD:C_0402_1005Metric
      C_VREG_2:
        symbol: Device:C
        sheet: MCU_Core
        value: 4.7µF
        footprint: Capacitor_SMD:C_0402_1005Metric
      C_VREG_AVDD:
        symbol: Device:C
        sheet: MCU_Core
        value: 4.7µF
        footprint: Capacitor_SMD:C_0402_1005Metric
      C_QSPI_IOVDD:
        symbol: Device:C
        sheet: MCU_Core
        value: 100nF
        footprint: Capacitor_SMD:C_0402_1005Metric
      C_IOVDD_1:
        symbol: Device:C
        sheet: MCU_Core
        value: 100nF
        footprint: Capacitor_SMD:C_0402_1005Metric
      C_IOVDD_2:
        symbol: Device:C
        sheet: MCU_Core
        value: 100nF
        footprint: Capacitor_SMD:C_0402_1005Metric
      C_1V1_1:
        symbol: Device:C
        sheet: MCU_Core
        value: 100nF
        footprint: Capacitor_SMD:C_0402_1005Metric
      C_1V1_2:
        symbol: Device:C
        sheet: MCU_Core
        value: 100nF
        footprint: Capacitor_SMD:C_0402_1005Metric
      R_ADC_AVDD1:
        symbol: Device:R
        sheet: MCU_Core
        value: 200Ω
        footprint: Resistor_SMD:R_0603_1608Metric
      R_ADC_AVDD2:
        symbol: Device:R
        sheet: MCU_Core
        value: 1Ω
        footprint: Resistor_SMD:R_0402_1005Metric
      C_ADC_AVDD1:
        symbol: Device:C
        sheet: MCU_Core
        value: 100nF
        footprint: Capacitor_SMD:C_0603_1608Metric
      C_ADC_AVDD2:
        symbol: Device:C
        sheet: MCU_Core
        value: 4.7µF
        footprint: Capacitor_SMD:C_0603_1608Metric
      R_VSYS1:
        symbol: Device:R
        sheet: MCU_Core
        value: 200kΩ
        footprint: Resistor_SMD:R_0402_1005Metric
      R_VSYS2:
        symbol: Device:R
        sheet: MCU_Core
        value: 100kΩ
        footprint: Resistor_SMD:R_0402_1005Metric
    connections:
      # Power
      - net: 3V3
        pins: [U_MCU:IOVDD, U_MCU:53, U_MCU:VREG_VIN, U_MCU:VREG_AVDD,
               U_MCU:QSPI_IOVDD, U_FLASH:VCC, C_IOVDD_1:1, C_IOVDD_2:1,
               C_VREG_AVDD:1, C_QSPI_IOVDD:1]
      # Remaining physically-separate IOVDD pins (same 3V3 net, by number)
      - net: 3V3
        pins: [U_MCU:11, U_MCU:20, U_MCU:30, U_MCU:38, U_MCU:45]
      - net: GND
        pins: [U_MCU:GND, U_FLASH:GND, C16:2, C17:2,
               C_IOVDD_1:2, C_IOVDD_2:2, C_VREG_AVDD:2, C_QSPI_IOVDD:2,
               U_MCU:VREG_PGND, SW_BOOTSEL:1,
               C_ADC_AVDD1:2, C_ADC_AVDD2:2]
      # RP2350 core switching regulator: VREG_LX -> L_VREG -> 1V1 rail,
      # feedback (VREG_FB) senses the same 1V1 rail. DVDD pins (multiple
      # physical pads) are powered from that same regulated 1V1 rail.
      - net: MCU_1V1
        pins: [U_MCU:DVDD, U_MCU:23, U_MCU:39, U_MCU:VREG_FB,
               L_VREG:2, C_VREG_1:1, C_VREG_2:1, C_1V1_1:1, C_1V1_2:1]
      - net: MCU_VREG_LX
        pins: [U_MCU:VREG_LX, L_VREG:1]
      - net: GND
        pins: [C_VREG_1:2, C_VREG_2:2, C_1V1_1:2, C_1V1_2:2]
      # ADC_AVDD: two-stage RC filter off 3V3 (matches Pico 2 W reference)
      - net: 3V3
        pins: [R_ADC_AVDD1:1]
      - net: MCU_ADC_FILT2
        pins: [R_ADC_AVDD1:2, C_ADC_AVDD1:1, R_ADC_AVDD2:1]
      - net: MCU_ADC_AVDD
        pins: [R_ADC_AVDD2:2, C_ADC_AVDD2:1, U_MCU:ADC_AVDD]
      # USB (external USB-C connector, via 27R series per RP2350 ref design)
      - net: USB_DP_MCU
        pins: [R_USB_DP:2, U_MCU:USB_DP]
      - net: USB_DM_MCU
        pins: [R_USB_DM:2, U_MCU:USB_DM]
      # QSPI flash
      - net: QSPI_SS
        pins: ["U_MCU:~{QSPI_SS}", "U_FLASH:~{CS}", R11:2]
      - net: QSPI_SCLK
        pins: [U_MCU:QSPI_SCLK, U_FLASH:CLK]
      - net: QSPI_SD0
        pins: [U_MCU:QSPI_SD0, "U_FLASH:DI/IO_{0}"]
      - net: QSPI_SD1
        pins: [U_MCU:QSPI_SD1, "U_FLASH:DO/IO_{1}"]
      - net: QSPI_SD2
        pins: [U_MCU:QSPI_SD2, "U_FLASH:~{WP}/IO_{2}"]
      - net: QSPI_SD3
        pins: [U_MCU:QSPI_SD3, "U_FLASH:~{HOLD}/~{RESET}/IO_{3}"]
      # BOOTSEL: pulls QSPI_SS low through R11 to force USB boot
      - net: GND
        pins: [SW_BOOTSEL:1]
      - net: BOOTSEL_SW
        pins: [SW_BOOTSEL:2, R11:1]
      # Crystal
      - net: MCU_XIN
        pins: [U_MCU:XIN, X1:1, C16:1]
      - net: MCU_XOUT
        pins: [U_MCU:XOUT, X1:2, C17:1]
      # RUN: internal ~50k pull-up, no external reset circuit (matches
      # Pico 2 W reference — no manual reset button)
      - net: MCU_RUN
        pins: [U_MCU:RUN]
      # SPI1 - XBee
      - net: SPI_SCK
        pins: [U_MCU:GPIO10, U_XBEE:SPI_CLK]
      - net: SPI_MOSI
        pins: [U_MCU:GPIO11, U_XBEE:SPI_MOSI]
      - net: SPI_MISO
        pins: [U_MCU:GPIO12, U_XBEE:SPI_MISO]
      - net: XBee_CS
        pins: [U_MCU:GPIO13, U_XBEE:SPI_SSEL]
      - net: XBEE_ON_SLEEP
        pins: [U_MCU:GPIO17, U_XBEE:ON_SLEEP]
      - net: XBEE_SPI_ATTN
        pins: [U_MCU:GPIO18, U_XBEE:SPI_ATTN]
      # SWD debug port not broken out to a header; GPIO19 is the one
      # remaining spare pin
      - no_connect: [U_MCU:SWCLK, U_MCU:SWDIO, U_MCU:GPIO19]
      # I2C0 - OLED
      - net: I2C_SDA
        pins: [U_MCU:GPIO4, U_OLED:SDA, R_I2C_SDA:2]
      - net: I2C_SCL
        pins: [U_MCU:GPIO5, U_OLED:SCL, R_I2C_SCL:2]
      # ADC inputs
      - net: TRIG_ANALOG
        pins: [U_MCU:GPIO26/ADC0, U_HALL:OUT]
      - net: STICK_X
        pins: [U_MCU:GPIO27/ADC1, J_STICK:Pin_3]
      - net: STICK_Y
        pins: [U_MCU:GPIO28/ADC2, J_STICK:Pin_4]
      # Misc control
      - net: RGB_DIN
        pins: [U_MCU:GPIO22, R_RGB:2]
      # Power control
      # Digital buttons (internal pull-ups in firmware)
      - net: BTN_VOL_UP
        pins: [U_MCU:GPIO0, SW_VOL_UP:1]
      - net: BTN_VOL_DN
        pins: [U_MCU:GPIO1, SW_VOL_DN:1]
      - net: BTN_TRIG_DIG
        pins: [U_MCU:GPIO2, SW_TRIG_DIG:1]
      - net: BTN_STICK
        pins: [U_MCU:GPIO3, J_STICK:Pin_5]
      # Macro button matrix
      - net: MAT_R0
        pins: [U_MCU:GPIO6, SW_MACRO1:1, SW_MACRO2:1, SW_MACRO3:1]
      - net: MAT_R1
        pins: [U_MCU:GPIO7, SW_MACRO4:1, SW_MACRO5:1, SW_MACRO6:1]
      - net: MAT_C0
        pins: [U_MCU:GPIO8, D_MACRO1:K, D_MACRO4:K]
      - net: MAT_C1
        pins: [U_MCU:GPIO9, D_MACRO2:K, D_MACRO5:K]
      - net: MAT_C2
        pins: [U_MCU:GPIO14, D_MACRO3:K, D_MACRO6:K]
      # Wireless module control (bit-banged 3-wire gSPI-style interface,
      # matching the official Pico 2 W's own RP2350<->CYW43439 wiring
      # exactly so the existing pico-sdk cyw43 PIO driver applies unmodified)
      - net: WL_CLK
        pins: [U_MCU:GPIO24, U_WIFI:SDIO_CLK]
      - net: WL_D
        pins: [U_MCU:GPIO23, R22:2]
      - net: WL_CS
        pins: [U_MCU:GPIO25, U_WIFI:SDIO_DATA_3]
      - net: WL_ON
        pins: [U_MCU:GPIO16, U_WIFI:WL_REG_ON, U_WIFI:BT_REG_ON]
      # VSYS battery-voltage sense: divide-by-3 (matches the Pico 2 W
      # module's own onboard divider ratio, which no longer exists now
      # that we're not using that module) into GP29 (ADC3). Freed up by
      # moving WL_ON off GP29 above.
      - net: VSYS_SENSE
        pins: [R_VSYS1:2, R_VSYS2:1, U_MCU:GPIO29/ADC3]
      - net: GND
        pins: [R_VSYS2:2]

  # -------------------------------------------------------------------------
  # 6b. Wireless: Murata Type 1YN (CYW43439 WiFi+BT, pre-certified module)
  # -------------------------------------------------------------------------
  # Replaces the Pico 2 W module's onboard CYW43439 + Abracon "Niche"
  # patented antenna (which requires a separate license from Abracon).
  # Type 1YN uses the same CYW43439 die as the Pico 2 W with its own
  # pre-certified (FCC/CE) antenna and RF matching already done — no RF
  # design or antenna licensing needed on our side.
  #
  # Digital interface deliberately replicates the Pico 2 W's own bit-banged
  # 3-wire scheme (WL_CLK/WL_D/WL_CS) instead of Murata's generic 4-bit
  # SDIO reference circuit, because RP2350 has no real SDIO host controller
  # — its Pico SDK cyw43 driver only speaks this specific PIO-bitbanged
  # protocol. SDIO_CMD+SDIO_DATA_0 short directly to WL_D through R22;
  # SDIO_DATA_1+SDIO_DATA_2 short directly together and join the same WL_D
  # node through R23. Values/topology taken directly from the official
  # RPI-PICO2W schematic (sheet 2), not estimated.
  #
  # WL_ON drives both WL_REG_ON and BT_REG_ON together (WiFi+BT enable as
  # one unit, matching the Pico 2 W reference).
  #
  # LPO_IN needs a driven 32.768kHz clock, not a passive crystal load — see
  # pin 37 description in the Type 1YN datasheet ("External sleep clock
  # input"). U_LPO below is a generic 32.768kHz CMOS oscillator IC.
  #
  # LAYOUT NOTE (not representable in schematic-only yaml): GND(SR_PVSS)
  # (pins 32/33) must be an isolated ground pour, per Murata's own
  # datasheet warning, not merged with the general ground plane. The
  # antenna trace geometry itself must exactly copy Murata's Hardware
  # Application Note Figure 4 (Trace Antenna Guideline) — this is a
  # PCB-layout-stage requirement, not a schematic component.
  Wireless:
    components:
      U_WIFI:
        symbol: SnipsControllers:Murata_Type1YN
        sheet: Wireless
        value: LBEE5KL1YN
        footprint: SnipsControllers:Murata_Type1YN
        # Land pattern generated from Murata's official
        # type1yn-module-footprint-topview.dxf (46 pads: 42 perimeter +
        # 4 large GND/shield pads), pin numbers cross-checked against
        # Figure 4 (Pin Assignments Top View) in the datasheet.
      U_LPO:
        symbol: SnipsControllers:Osc_32k768_3pin
        sheet: Wireless
        value: 32.768kHz_oscillator
        footprint: Oscillator:Oscillator_SMD_SiTime_SiT8008-4pin_2.0x1.6mm
      R22:
        symbol: Device:R
        sheet: Wireless
        value: 470Ω
        footprint: Resistor_SMD:R_0402_1005Metric
      R23:
        symbol: Device:R
        sheet: Wireless
        value: 10kΩ
        footprint: Resistor_SMD:R_0402_1005Metric
      C_WL_VBAT1:
        symbol: Device:C
        sheet: Wireless
        value: 4.7µF
        footprint: Capacitor_SMD:C_0402_1005Metric
      C_WL_VBAT2:
        symbol: Device:C
        sheet: Wireless
        value: 4.7µF
        footprint: Capacitor_SMD:C_0402_1005Metric
      L_WL_VBAT:
        symbol: Device:L
        sheet: Wireless
        value: 2.2µH
        footprint: Inductor_SMD:L_0402_1005Metric
        # LQM18PN2R2MGH recommended per Murata reference circuit
      C_WL_VIO:
        symbol: Device:C
        sheet: Wireless
        value: 2.2µF
        footprint: Capacitor_SMD:C_0402_1005Metric
    connections:
      # WL_D bus: SDIO_CMD+SDIO_DATA_0 shorted direct; SDIO_DATA_1+
      # SDIO_DATA_2 shorted direct through R23; both join WL_D through R22
      - net: WL_D_BUS0
        pins: [U_WIFI:SDIO_CMD, U_WIFI:SDIO_DATA_0, R22:1]
      - net: WL_D_BUS1
        pins: [U_WIFI:SDIO_DATA_1, U_WIFI:SDIO_DATA_2, R23:1]
      - net: WL_D_BUS0
        pins: [R23:2]
      # Power
      - net: 3V3
        pins: [U_WIFI:VBAT, U_WIFI:VIN_LDO, U_WIFI:VIO, C_WL_VBAT1:1,
               C_WL_VBAT2:1, C_WL_VIO:1, L_WL_VBAT:2, U_LPO:VDD]
      - net: WL_VREG_LX
        pins: [U_WIFI:SR_VLX, L_WL_VBAT:1]
      - net: GND
        pins: [U_WIFI:GND, U_WIFI:GND_12, U_WIFI:GND_19, U_WIFI:GND_21,
               U_WIFI:GND_29, U_WIFI:GND_32_SR_PVSS, U_WIFI:GND_33_SR_PVSS,
               U_WIFI:GND_35, U_WIFI:GND_40, U_WIFI:GND_42, U_WIFI:GND_43,
               U_WIFI:GND_44, U_WIFI:GND_45, U_WIFI:GND_46,
               U_WIFI:BT_DEV_WAKE, C_WL_VBAT1:2, C_WL_VBAT2:2, C_WL_VIO:2,
               U_LPO:GND]
      - net: WL_LPO
        pins: [U_WIFI:LPO_IN, U_LPO:OUT]
      # Unused per Pico 2 W reference: BT UART (2-5), NC pads (6,7,13,15,16),
      # BT PCM (8-11), WL_GPIO_0/1/2 (27,18,17), BT_HOST_WAKE (38).
      # ANT (41): RF output goes to a PCB trace antenna at layout time, not
      # a schematic net.
      - no_connect: [U_WIFI:2, U_WIFI:3, U_WIFI:4, U_WIFI:5, U_WIFI:6,
                     U_WIFI:7, U_WIFI:8, U_WIFI:9, U_WIFI:10, U_WIFI:11,
                     U_WIFI:13, U_WIFI:15, U_WIFI:16, U_WIFI:17, U_WIFI:18,
                     U_WIFI:27, U_WIFI:38, U_WIFI:41]

  # -------------------------------------------------------------------------
  # 7. XBee3 Radio (SPI mode, THT socket)
  # -------------------------------------------------------------------------
  # THT socket for prototyping. Update footprint for SMT module on final PCB.
  # RESET: 10kΩ pull-up to 3V3 + RC filter (100Ω + 100nF) per AmidalaShield.
  # Decoupling: 100nF on VCC.
  XBee:
    components:
      U_XBEE:
        symbol: Xbee3:XB3-24Z8UT-J
        sheet: XBee
        value: XBee3
        footprint: RF_Module:XBee_THT
      C_XBEE_VCC:
        symbol: Device:C
        sheet: XBee
        value: 100nF
        footprint: Capacitor_SMD:C_0402_1005Metric
      R_XBEE_RST:
        symbol: Device:R
        sheet: XBee
        value: 10kΩ
        footprint: Resistor_SMD:R_0402_1005Metric
      R_XBEE_RC:
        symbol: Device:R
        sheet: XBee
        value: 100Ω
        footprint: Resistor_SMD:R_0402_1005Metric
      C_XBEE_RC:
        symbol: Device:C
        sheet: XBee
        value: 100nF
        footprint: Capacitor_SMD:C_0402_1005Metric
    connections:
      - net: 3V3
        pins: [U_XBEE:VCC, C_XBEE_VCC:1, R_XBEE_RST:1]
      - net: GND
        pins: [U_XBEE:GND, C_XBEE_VCC:2, C_XBEE_RC:2]
      - net: XBEE_RST_PU
        pins: [R_XBEE_RST:2, R_XBEE_RC:1, C_XBEE_RC:1]
      - net: XBEE_RESET
        pins: [U_XBEE:RESET, R_XBEE_RC:2]
      # DTR/ON_SLEEP/SPI_ATTN per Amidala's actual AmidalaShield netlist
      # (pulled from its IPC-2581 export, not guessed): DTR tied low,
      # ON_SLEEP and SPI_ATTN go to host GPIO. SPI_ATTN is the XBee's
      # data-ready interrupt line — needed for reliable SPI transfers
      # rather than polling, not just a nice-to-have.
      - net: GND
        pins: [U_XBEE:DTR]
      # Remaining auxiliary pins unused: DOUT/DIN(secondary UART),
      # RSSI_PWM, PWM1, [RESERVED]x2, CTS, ASSOCIATE, RTS, AD0
      - no_connect: [U_XBEE:2, U_XBEE:3, U_XBEE:6, U_XBEE:7, U_XBEE:8,
                     U_XBEE:12, U_XBEE:14, U_XBEE:15, U_XBEE:16, U_XBEE:20]

  # -------------------------------------------------------------------------
  # 8. SSD1306 OLED Display (1.3", 128x64, I2C)
  # -------------------------------------------------------------------------
  # I2C address: 0x3C (default). I2C pull-ups included as 4.7kΩ.
  # Mark R_I2C_SDA and R_I2C_SCL as DNP if OLED breakout has them onboard.
  # Decoupling: 10µF + 100nF on VCC.
  OLED:
    components:
      U_OLED:
        symbol: SnipsControllers:SSD1306_OLED_4pin
        sheet: OLED
        value: SSD1306_1.3in
        footprint: Display_OLED:OLED_1.3in_4pin_I2C
      C_OLED_1:
        symbol: Device:C
        sheet: OLED
        value: 10µF
        footprint: Capacitor_SMD:C_0805_2012Metric
      C_OLED_2:
        symbol: Device:C
        sheet: OLED
        value: 100nF
        footprint: Capacitor_SMD:C_0402_1005Metric
      R_I2C_SDA:
        symbol: Device:R
        sheet: OLED
        value: 4.7kΩ
        footprint: Resistor_SMD:R_0402_1005Metric
        # DNP when using Adafruit #938 breakout — pull-ups already onboard
        # Populate only when using bare OLED panel on final custom PCB
      R_I2C_SCL:
        symbol: Device:R
        sheet: OLED
        value: 4.7kΩ
        footprint: Resistor_SMD:R_0402_1005Metric
        # DNP when using Adafruit #938 breakout — pull-ups already onboard
        # Populate only when using bare OLED panel on final custom PCB
    connections:
      - net: 3V3
        pins: [U_OLED:VCC, C_OLED_1:1, C_OLED_2:1, R_I2C_SDA:1, R_I2C_SCL:1]
      - net: GND
        pins: [U_OLED:GND, C_OLED_1:2, C_OLED_2:2]

  # -------------------------------------------------------------------------
  # 9. DRV5055 Analog Hall Effect Trigger Sensor
  # -------------------------------------------------------------------------
  # Ratiometric linear output, 3.3V native. A2 variant (50mV/mT).
  # Decoupling: 100nF on VCC.
  # Package: TO-92 for prototyping, SOT-23 for final PCB.
  Hall_Trigger:
    components:
      U_HALL:
        symbol: Sensor_Magnetic:DRV5055A2xLPGxQ1
        sheet: Hall_Trigger
        value: DRV5055A2
        footprint: Package_TO_SOT_THT:TO-92_Inline
      C_HALL:
        symbol: Device:C
        sheet: Hall_Trigger
        value: 100nF
        footprint: Capacitor_SMD:C_0402_1005Metric
    connections:
      - net: 3V3
        pins: [U_HALL:VCC, C_HALL:1]
      - net: GND
        pins: [U_HALL:GND, C_HALL:2]

  # -------------------------------------------------------------------------
  # 10. GuliKit Hall Effect Thumbstick
  # -------------------------------------------------------------------------
  # Native 3.3V. X/Y analog outputs, KEY digital click (active low).
  # Decoupling: 100nF on VCC.
  Thumbstick:
    components:
      J_STICK:
        symbol: Connector_Generic:Conn_01x05
        sheet: Thumbstick
        value: GuliKit_Thumbstick
        footprint: Connector_PinHeader_2.54mm:PinHeader_1x05_P2.54mm_Vertical
      C_STICK:
        symbol: Device:C
        sheet: Thumbstick
        value: 100nF
        footprint: Capacitor_SMD:C_0402_1005Metric
    connections:
      - net: 3V3
        pins: [J_STICK:Pin_1, C_STICK:1]
      - net: GND
        pins: [J_STICK:Pin_2, C_STICK:2]

  # -------------------------------------------------------------------------
  # 11. SK6812 RGB LED (NeoPixel-compatible)
  # -------------------------------------------------------------------------
  # SK6812 chosen over WS2812B for explicit 3.3V VDD compatibility.
  # Pin and protocol compatible with WS2812B — same PIO driver code works.
  # Driven via RP2350 PIO on GP22.
  # R_RGB: 300-500Ω series on DIN for signal integrity (standard practice).
  # Decoupling: 100nF on VCC.
  RGB_LED:
    components:
      D_RGB:
        symbol: LED:SK6812
        sheet: RGB_LED
        value: SK6812
        footprint: LED_SMD:LED_SK6812_PLCC4_5.0x5.0mm_P3.2mm
      R_RGB:
        symbol: Device:R
        sheet: RGB_LED
        value: 330Ω
        footprint: Resistor_SMD:R_0402_1005Metric
      C_RGB:
        symbol: Device:C
        sheet: RGB_LED
        value: 100nF
        footprint: Capacitor_SMD:C_0402_1005Metric
    connections:
      - net: 3V3
        pins: [D_RGB:VDD, C_RGB:1]
      - net: GND
        pins: [D_RGB:VSS, C_RGB:2]
      - net: RGB_DIN_R
        pins: [R_RGB:1]
      - net: RGB_DIN_R
        pins: [D_RGB:DIN]
      # DOUT: chains to the next LED in a strip — no next LED in this design
      - no_connect: [D_RGB:DOUT]

  # -------------------------------------------------------------------------
  # 12. Macro Button Matrix (2x3, 6 buttons)
  # -------------------------------------------------------------------------
  # 2 rows (GP6/GP7) x 3 columns (GP8/GP9/GP14).
  # Each button has a 1N4148 diode (anode to switch, cathode to column)
  # to prevent ghosting on simultaneous presses.
  # Scan: drive one row LOW, read columns (internal pull-ups on GP8/9/14).
  #
  # Layout:
  #          Col0(GP8)  Col1(GP9)  Col2(GP14)
  # Row0(GP6)  MACRO1     MACRO2     MACRO3
  # Row1(GP7)  MACRO4     MACRO5     MACRO6
  Button_Matrix:
    components:
      SW_MACRO1:
        symbol: Switch:SW_Push
        sheet: Button_Matrix
        value: Omron_B3F
        footprint: Button_Switch_THT:SW_PUSH_6mm
      SW_MACRO2:
        symbol: Switch:SW_Push
        sheet: Button_Matrix
        value: Omron_B3F
        footprint: Button_Switch_THT:SW_PUSH_6mm
      SW_MACRO3:
        symbol: Switch:SW_Push
        sheet: Button_Matrix
        value: Omron_B3F
        footprint: Button_Switch_THT:SW_PUSH_6mm
      SW_MACRO4:
        symbol: Switch:SW_Push
        sheet: Button_Matrix
        value: Omron_B3F
        footprint: Button_Switch_THT:SW_PUSH_6mm
      SW_MACRO5:
        symbol: Switch:SW_Push
        sheet: Button_Matrix
        value: Omron_B3F
        footprint: Button_Switch_THT:SW_PUSH_6mm
      SW_MACRO6:
        symbol: Switch:SW_Push
        sheet: Button_Matrix
        value: Omron_B3F
        footprint: Button_Switch_THT:SW_PUSH_6mm
      D_MACRO1:
        symbol: Device:D_Small
        sheet: Button_Matrix
        value: 1N4148
        footprint: Diode_SMD:D_SOD-123
      D_MACRO2:
        symbol: Device:D_Small
        sheet: Button_Matrix
        value: 1N4148
        footprint: Diode_SMD:D_SOD-123
      D_MACRO3:
        symbol: Device:D_Small
        sheet: Button_Matrix
        value: 1N4148
        footprint: Diode_SMD:D_SOD-123
      D_MACRO4:
        symbol: Device:D_Small
        sheet: Button_Matrix
        value: 1N4148
        footprint: Diode_SMD:D_SOD-123
      D_MACRO5:
        symbol: Device:D_Small
        sheet: Button_Matrix
        value: 1N4148
        footprint: Diode_SMD:D_SOD-123
      D_MACRO6:
        symbol: Device:D_Small
        sheet: Button_Matrix
        value: 1N4148
        footprint: Diode_SMD:D_SOD-123
    connections:
      # Row 0 (GP6): MACRO1, MACRO2, MACRO3
      # Row 1 (GP7): MACRO4, MACRO5, MACRO6
      # Switch to diode anode
      - net: MAT_SW1_D
        pins: [SW_MACRO1:2, D_MACRO1:A]
      - net: MAT_SW2_D
        pins: [SW_MACRO2:2, D_MACRO2:A]
      - net: MAT_SW3_D
        pins: [SW_MACRO3:2, D_MACRO3:A]
      - net: MAT_SW4_D
        pins: [SW_MACRO4:2, D_MACRO4:A]
      - net: MAT_SW5_D
        pins: [SW_MACRO5:2, D_MACRO5:A]
      - net: MAT_SW6_D
        pins: [SW_MACRO6:2, D_MACRO6:A]
      # Diode cathode to column

  # -------------------------------------------------------------------------
  # 13. Direct Buttons (vol up/dn, digital trigger)
  # -------------------------------------------------------------------------
  # Active low, internal pull-ups in firmware. Wire to GND.
  Buttons_Direct:
    components:
      SW_VOL_UP:
        symbol: Switch:SW_Push
        sheet: Buttons_Direct
        value: Omron_B3F
        footprint: Button_Switch_THT:SW_PUSH_6mm
      SW_VOL_DN:
        symbol: Switch:SW_Push
        sheet: Buttons_Direct
        value: Omron_B3F
        footprint: Button_Switch_THT:SW_PUSH_6mm
      SW_TRIG_DIG:
        symbol: Switch:SW_Push
        sheet: Buttons_Direct
        value: Omron_B3F
        footprint: Button_Switch_THT:SW_PUSH_6mm
    connections:
      - net: GND
        pins: [SW_VOL_UP:2, SW_VOL_DN:2, SW_TRIG_DIG:2]

  # -------------------------------------------------------------------------
  # 14. ERC power flags
  # -------------------------------------------------------------------------
  # KiCad's ERC requires every net with a "power input" pin on it to also
  # have a "power output" pin (or a PWR_FLAG) somewhere on that same net,
  # to confirm the net is actually externally driven. None of our regulator
  # ICs expose a strictly "power_out"-typed pin on 3V3/GND/MCU_1V1/
  # MCU_ADC_AVDD (their outputs come through inductors/resistors, which are
  # "passive"-typed), so ERC can't infer it on its own. Standard, expected
  # step for any schematic — not a design bug.
  # Positions pinned explicitly, off in isolated space away from all other
  # components — kicaddy's auto-layout is not stable between compiles
  # (positions shift on unrelated yaml edits), and these tiny symbols kept
  # landing on top of unrelated wires (crystal, wireless module) causing
  # spurious ERC pin-to-pin/multiple-net-name errors purely from geometric
  # overlap, not any actual connection.
  Power_Flags:
    components:
      PF_3V3:
        symbol: power:PWR_FLAG
        sheet: MCU_Core
