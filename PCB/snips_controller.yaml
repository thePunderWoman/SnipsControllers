      - net: MAT_SW5_D
        pins: [SW_MACRO5:2, D_MACRO5:A]
      - net: MAT_SW6_D
        pins: [SW_MACRO6:2, D_MACRO6:A]
      # Diode cathode to column
      - net: MAT_C0
        pins: [D_MACRO1:K, D_MACRO4:K]
      - net: MAT_C1
        pins: [D_MACRO2:K, D_MACRO5:K]
      - net: MAT_C2
        pins: [D_MACRO3:K, D_MACRO6:K]

