      - net: BTN_TRIG_DIG
        pins: [SW_TRIG_DIG:1]
      - net: GND
        pins: [SW_VOL_UP:2, SW_VOL_DN:2, SW_TRIG_DIG:2]

# ---------------------------------------------------------------------------
# DESIGN NOTES
# ---------------------------------------------------------------------------
# 1. bq25185 TS/MR pin: MUST tie to GND via 10kΩ (R_TS) if no thermistor.
#    Floating TS = charging suspended. Critical, easy to miss.
#
# 2. TLV62569 output voltage set by R_FB1/R_FB2 divider.
#    VOUT = 0.6V * (1 + R_FB1/R_FB2). Verify with 1% resistors.
#
# 3. USB-C CC resistors (R_CC1, R_CC2 = 5.1kΩ to GND) REQUIRED for
#    USB-C chargers to negotiate power. Omitting = no charging from USB-C.
#
# 4. I2C pull-ups (R_I2C_SDA, R_I2C_SCL): DNP for prototyping.
#    Adafruit #938 breakout has onboard pull-ups — do not populate externally
#    or effective resistance will be halved causing I2C issues.
#    Populate only on final custom PCB using bare OLED panel without breakout.
#
# 5. XBee RESET RC filter: same as AmidalaShield V1.2.
#    10kΩ pull-up to 3V3, 100Ω series + 100nF to GND at RESET pin.
#
# 6. Battery voltage sense: GP29 onboard VSYS divider (reads VSYS/3).
#    No external components needed.
#    FIRMWARE CONSTRAINT: CYW43439 WiFi SPI shares the GP29 ADC path via
#    the SPI CLK line. Battery voltage reads on GP29 ADC are unreliable
#    while a CYW43439 SPI transaction is in progress. Firmware must gate
#    battery ADC reads to occur only when WiFi SPI is idle. This applies
#    to any future WiFi use (e.g. syncing data with Amidala, accessories).
#
# 7. Pico 2 W powered via VSYS pin. Do NOT drive 3V3 pin externally.
#
# 8. GP16-GP19 reserved for CYW43439 WiFi SPI. Do not connect externally.
#
# 9. CE pin on bq25185 tied to GND (always enable charging).
#
# 10. Power control: GP21 must be driven HIGH as the very first instruction
#     in firmware or power cuts when user releases the power button.
#
# 11. WS2812 DIN series resistor (R_RGB = 330Ω) placed close to GP22 pad.
#     WS2812 runs at 3.3V supply (reduced brightness vs 5V nominal —
#     acceptable for status indicator).
#
# 12. Button matrix: diodes are mandatory to prevent ghosting on
#     simultaneous button presses. 1N4148 SOD-123 SMD recommended.
#     Anode to switch, cathode to column line.
#
# 13. STAT2 on bq25185 left floating (not connected). STAT1 alone provides
#     sufficient charge state indication for firmware/display use.
#
# 14. XBee footprint: RF_Module:XBee_THT for prototyping.
#     Update to SMT module footprint for final PCB if size requires it.
#
# 15. No spare GPIO — all 22 available user GPIO are assigned.