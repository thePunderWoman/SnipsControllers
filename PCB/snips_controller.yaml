project:
  name: Snips Controller
  revision: 0.1
  description: >
    Wireless handheld R2-D2 controller (Snips Controller). ESP32-S3-WROOM-1
    module MCU (integrated WiFi/BT, flash, crystal, antenna — no external
    RF/flash/crystal design needed; see MCU_Core section), custom USB-C for
    flashing/charging/future accessory expansion, XBee3 Zigbee radio over
    SPI, hall effect thumbstick and analog trigger, SSD1306 OLED display,
    WS2812 RGB LED, embedded bq25185 charger + TLV62569 3.3V buck, swappable
    single-cell Li-ion battery, soft-latch power control. Macro buttons are
    direct-wired (no scan matrix) — ESP32-S3-WROOM-1 has ample spare GPIO,
    unlike the bare-RP2350A design this replaced.

# ---------------------------------------------------------------------------
# NET LEGEND
# ---------------------------------------------------------------------------
# VBUS        - 5V USB input from USB-C connector
# VSYS        - Battery/charger system output (bq25185 SYS pin), ~3.7-4.5V
# 3V3         - Regulated 3.3V output from TLV62569 buck
# GND         - Ground
# VBAT        - Battery positive terminal
# USB_DP_MCU/USB_DM_MCU - USB D+/D- data lines (native USB, U_MCU pins 14/13)
# I2C_SDA     - I2C data (pin 12) — OLED
# I2C_SCL     - I2C clock (pin 17) — OLED
# SPI_SCK     - XBee SPI clock (pin 18)
# SPI_MOSI    - XBee SPI MOSI (pin 19)
# SPI_MISO    - XBee SPI MISO (pin 20)
# XBee_CS     - XBee SPI chip select (pin 21)
# XBEE_ON_SLEEP - XBee ON/~SLEEP status, host input (pin 22)
# XBEE_SPI_ATTN - XBee SPI data-ready interrupt (pin 8)
# TRIG_ANALOG - Analog trigger output from DRV5055 (pin 4, ADC1_CH3)
# STICK_X     - Thumbstick X axis (pin 5, ADC1_CH4)
# STICK_Y     - Thumbstick Y axis (pin 6, ADC1_CH5)
# STAT1       - bq25185 charge status pin 1 (open-drain, pin 39)
# RGB_DIN     - WS2812 NeoPixel data in (pin 37)
# PWR_EN      - TLV62569 EN signal, driven by soft latch PFET drain
# PWR_GATE    - PFET gate node (pulled HIGH by default = off)
# PWR_LATCH_G - NFET latch gate (driven by button OR PWR_HOLD)
# PWR_HOLD    - Pin 36 output to OR diode, holds latch after boot
# PWR_BTN_SENSE - Power button junction: R_BTN_PU/R_PWR_SENSE divider
#               midpoint, pulled to VSYS, button pulls to GND, feeds pin 38
# BTN_*       - Individual button nets (pulled up internally, wired to GND),
#               includes the 6 macro buttons — direct-wired, no scan matrix
# MCU_EN      - EN (reset) pin, pulled up via R_EN_PU
# MCU_BOOT    - GPIO0/BOOT strapping pin, pulled up via R_BOOT_PU, button
#               pulls low to enter UF2/download mode
# VSYS_SENSE  - Divide-by-3 VSYS sense into pin 7 (ADC1_CH6), via
#               R_VSYS1/R_VSYS2

# ---------------------------------------------------------------------------
# RESERVED GPIO — DO NOT USE
# ---------------------------------------------------------------------------
# Pin 3  (EN)      - reset/enable, pulled up via R_EN_PU
# Pin 27 (GPIO0)   - BOOT strapping pin, pulled up via R_BOOT_PU + button
# Pin 13 (GPIO19)  - USB_D-  (native USB)
# Pin 14 (GPIO20)  - USB_D+  (native USB)
# Pins 1, 40, 41   - GND
# Pin 2            - 3V3
# Pins 26-32 (internal, not broken out on the module) - internal SPI flash
# Pins 33-34 (not broken out on the WROOM-1 module at all)
#
# Use with care if ever needed (strapping pins, sampled at boot):
# Pin 15 (GPIO3), Pin 16 (GPIO46), Pin 26 (GPIO45)
#
# Spare (clean, no caveats) — default JTAG, fully reusable as plain GPIO:
# Pin 32 (GPIO39/MTCK), Pin 33 (GPIO40/MTDO), Pin 34 (GPIO41/MTDI),
# Pin 35 (GPIO42/MTMS)

# ---------------------------------------------------------------------------
groups:

  # -------------------------------------------------------------------------
  # 1. USB-C Connector
  # -------------------------------------------------------------------------
  # USB 2.0 only. CC resistors required for USB-C power negotiation.
  # VBUS -> bq25185 VIN. D+/D- -> ESP32-S3-WROOM-1 native USB data pins.
  # SHIELD -> GND.
  # USB_DP/USB_DM run from the connector through the 27R series resistors in
  # MCU_Core (R_USB_DP/R_USB_DM) to the ESP32-S3-WROOM-1's own native USB
  # pins (13/14). Real, exposed USB data — used for firmware flashing,
  # charging, and future accessory expansion, which is exactly what a
  # stock Pico-family module can't provide (its USB is hardwired to its
  # own onboard connector, not broken out).
  USB_C:
    components:
      J_USB:
        symbol: Connector:USB_C_Receptacle_USB2.0_16P
        sheet: USB_C
        value: USB-C
        footprint: Connector_USB:USB_C_Receptacle_HRO_TYPE-C-31-M-12
      R_CC1:
        symbol: Device:R
        sheet: USB_C
        value: 5.1kΩ
        footprint: Resistor_SMD:R_0402_1005Metric
      R_CC2:
        symbol: Device:R
        sheet: USB_C
        value: 5.1kΩ
        footprint: Resistor_SMD:R_0402_1005Metric
    connections:
      # USB-C receptacle duplicates VBUS/GND/D+/D- across the A and B rows
      # for cable-flip support — both instances of each must be tied
      # together (standard USB2-only practice: no orientation mux needed).
      # Name-based pin lookup only resolves the first match, so the B-row
      # duplicates are addressed explicitly by pin number.
      - net: VBUS
        global: true
        pins: [J_USB:VBUS,
               J_USB:A9,
               J_USB:B4,
               J_USB:B9,
               U_CHG:IN,
               C_VIN_1:1,
               C_VIN_2:1]
      - net: USB_DP
        pins: [J_USB:D+, J_USB:B6, R_USB_DP:1]
      - net: USB_DM
        pins: [J_USB:D-, J_USB:B7, R_USB_DM:1]
      - net: GND
        pins: [J_USB:GND, J_USB:A12, J_USB:B1, J_USB:B12, J_USB:SHIELD,
               R_CC1:2, R_CC2:2]
      - net: USB_CC1
        pins: [J_USB:CC1, R_CC1:1]
      - net: USB_CC2
        pins: [J_USB:CC2, R_CC2:1]
      # SBU1/SBU2 (DisplayPort Alt Mode sideband) unused — USB 2.0 only
      - no_connect: [J_USB:A8, J_USB:B8]

  # -------------------------------------------------------------------------
  # 2. bq25185 Battery Charger + Power Path
  # -------------------------------------------------------------------------
  # VIN    <- VBUS (5V USB)
  # SYS    -> VSYS rail
  # BAT    <-> VBAT
  # STAT1  -> GP20 (open-drain, 10kΩ pull-up to 3V3)
  # STAT2  -> not connected (left floating)
  # ISET   -> R_ISET to GND. ICHG = 300 AΩ / RISET.
  #           RISET = 600Ω -> ~500mA charge current
  # ILIM/VSET -> R_VSET = 18kΩ -> 4.2V VBATREG, 500mA input limit
  #           (per Table 7-1 in bq25185 datasheet)
  # TS/MR  -> R_TS = 10kΩ to GND (REQUIRED if no thermistor)
  # CE     -> GND (always enable charging)
  # Decoupling: 10µF + 100nF on VIN; 10µF + 100nF on SYS; 10µF on BAT
  # Use X7R/X5R ceramic, 25V rated on VIN and SYS pins
  Power_Charger:
    components:
      U_CHG:
        symbol: BQ25185DLHR:BQ25185DLHR
        sheet: Power_Charger
        value: bq25185
        footprint: BQ25185DLHR:IC_BQ25185DLHR
      C_VIN_1:
        symbol: Device:C
        sheet: Power_Charger
        value: 10µF
        footprint: Capacitor_SMD:C_0805_2012Metric
      C_VIN_2:
        symbol: Device:C
        sheet: Power_Charger
        value: 100nF
        footprint: Capacitor_SMD:C_0402_1005Metric
      C_SYS_1:
        symbol: Device:C
        sheet: Power_Charger
        value: 10µF
        footprint: Capacitor_SMD:C_0805_2012Metric
      C_SYS_2:
        symbol: Device:C
        sheet: Power_Charger
        value: 100nF
        footprint: Capacitor_SMD:C_0402_1005Metric
      C_BAT:
        symbol: Device:C
        sheet: Power_Charger
        value: 10µF
        footprint: Capacitor_SMD:C_0805_2012Metric
      R_ISET:
        symbol: Device:R
        sheet: Power_Charger
        value: 600Ω
        footprint: Resistor_SMD:R_0402_1005Metric
      R_VSET:
        symbol: Device:R
        sheet: Power_Charger
        value: 18kΩ
        footprint: Resistor_SMD:R_0402_1005Metric
      R_TS:
        symbol: Device:R
        sheet: Power_Charger
        value: 10kΩ
        footprint: Resistor_SMD:R_0402_1005Metric
      R_STAT1:
        symbol: Device:R
        sheet: Power_Charger
        value: 10kΩ
        footprint: Resistor_SMD:R_0402_1005Metric
    connections:
      - net: VSYS
        global: true
        pins: [U_CHG:SYS,
               C_SYS_1:1,
               C_SYS_2:1,
               U_BUCK:VIN,
               C_BUCK_IN:1,
               Q_PWR:S,
               R_GATE:1,
               R_BTN_PU:1,
               R_VSYS1:1,
               PF_VSYS:1]
      - net: VBAT
        pins: [U_CHG:BAT, C_BAT:1]
      - net: STAT1
        pins: [U_CHG:STAT1, R_STAT1:1, U_MCU:39]
      - net: 3V3
        pins: [R_STAT1:2]
      - net: GND
        pins: [U_CHG:GND, C_VIN_1:2, C_VIN_2:2, C_SYS_1:2, C_SYS_2:2,
               C_BAT:2, R_ISET:2, R_VSET:2, R_TS:2, "U_CHG:~{CE}",
               U_CHG:THERMAL_PAD]
      - net: CHG_ISET
        pins: [U_CHG:ISET, R_ISET:1]
      - net: CHG_VSET
        pins: [U_CHG:ILIM/VSET, R_VSET:1]
      - net: CHG_TS
        pins: [U_CHG:TS/MR, R_TS:1]
      # STAT2 left floating (not connected)
      - no_connect: [U_CHG:STAT2]

  # -------------------------------------------------------------------------
  # 3. TLV62569 3.3V Buck Converter
  # -------------------------------------------------------------------------
  # VIN    <- VSYS
  # VOUT   -> 3V3
  # EN     -> PWR_EN (soft latch power control, NOT tied to 3V3 directly)
  # FB     -> R_FB1/R_FB2 divider sets 3.3V output
  #           VOUT = 0.6V * (1 + R_FB1/R_FB2)
  #           R_FB1=100kΩ, R_FB2=56.2kΩ -> ~3.31V (verify with 1% resistors)
  # L      - 1µH, >=2A rating, low DCR
  # Decoupling: 10µF on VIN, 22µF on VOUT
  Power_Buck:
    components:
      U_BUCK:
        symbol: Regulator_Switching:TLV62569DBV
        sheet: Power_Buck
        value: TLV62569
        footprint: Package_TO_SOT_SMD:SOT-23-5
      L_BUCK:
        symbol: Device:L
        sheet: Power_Buck
        value: 1µH
        footprint: Inductor_SMD:L_Bourns_SRR1260
      C_BUCK_IN:
        symbol: Device:C
        sheet: Power_Buck
        value: 10µF
        footprint: Capacitor_SMD:C_0805_2012Metric
      C_BUCK_OUT:
        symbol: Device:C
        sheet: Power_Buck
        value: 22µF
        footprint: Capacitor_SMD:C_0805_2012Metric
      R_FB1:
        symbol: Device:R
        sheet: Power_Buck
        value: 100kΩ
        footprint: Resistor_SMD:R_0402_1005Metric
      R_FB2:
        symbol: Device:R
        sheet: Power_Buck
        value: 56.2kΩ
        footprint: Resistor_SMD:R_0402_1005Metric
    connections:
      - net: PWR_EN
        pins: [U_BUCK:EN, Q_PWR:D]
      - net: BUCK_SW
        pins: [U_BUCK:SW, L_BUCK:1]
      - net: 3V3
        pins: [L_BUCK:2, C_BUCK_OUT:1, R_FB1:2]
      - net: BUCK_FB
        pins: [U_BUCK:FB, R_FB1:1, R_FB2:1]
      - net: GND
        pins: [U_BUCK:GND, C_BUCK_IN:2, C_BUCK_OUT:2, R_FB2:2]

  # -------------------------------------------------------------------------
  # 4. Battery Holder
  # -------------------------------------------------------------------------
  # Single cell Li-ion (18650 or 14500 — to be determined empirically)
  Battery:
    components:
      BT1:
        symbol: Device:Battery
        sheet: Battery
        value: Li-ion_18650_or_14500
        footprint: Battery:BatteryHolder_Keystone_1042_1x18650
    connections:
      - net: VBAT
        pins: [BT1:+]
      - net: GND
        pins: [BT1:-]

  # -------------------------------------------------------------------------
  # 5. Power Control Circuit (soft latch, hybrid hardware+firmware)
  # -------------------------------------------------------------------------
  # Boot (hardware):
  #   EN pulled LOW by default (off). Press PWR button -> D_OR1 drives
  #   Q_LATCH gate HIGH -> Q_LATCH on -> Q_PWR gate pulled LOW -> PWR_EN HIGH
  #   -> TLV62569 EN HIGH -> 3V3 up -> Pico boots.
  #   Firmware drives GP21 HIGH immediately on boot to hold latch via D_OR2.
  #
  # Shutdown (firmware):
  #   Firmware monitors PWR button on GP15 (3-second hold).
  #   On shutdown: drive GP21 LOW -> Q_LATCH off -> R_GATE pulls Q_PWR gate
  #   HIGH -> PWR_EN LOW -> 3V3 cut.
  #
  # CRITICAL: GP21 must be driven HIGH as the very first instruction in
  # firmware or power cuts when user releases the power button.
  #
  # PWR_BTN_NODE pulled to VSYS via R_BTN_PU. R_PWR_SENSE (100kΩ to GND)
  # divides with R_BTN_PU (100kΩ) giving ~2.1V at GP15 when idle (HIGH).
  # Button press pulls to GND; GP15 reads LOW. 2.1V safe within 3.3V limit.
  Power_Control:
    components:
      Q_PWR:
        symbol: Transistor_FET:Q_PMOS_GSD
        sheet: Power_Control
        value: DMG2305UX
        footprint: Package_TO_SOT_SMD:SOT-23
      Q_LATCH:
        symbol: Transistor_FET:Q_NMOS_GSD
        sheet: Power_Control
        value: 2N7002
        footprint: Package_TO_SOT_SMD:SOT-23
      D_OR1:
        symbol: Device:D_Small
        sheet: Power_Control
        value: 1N4148W
        footprint: Package_TO_SOT_SMD:SOT-23
      D_OR2:
        symbol: Device:D_Small
        sheet: Power_Control
        value: 1N4148W
        footprint: Package_TO_SOT_SMD:SOT-23
      R_GATE:
        symbol: Device:R
        sheet: Power_Control
        value: 100kΩ
        footprint: Resistor_SMD:R_0402_1005Metric
      R_BTN_PU:
        symbol: Device:R
        sheet: Power_Control
        value: 100kΩ
        footprint: Resistor_SMD:R_0402_1005Metric
      R_PWR_SENSE:
        symbol: Device:R
        sheet: Power_Control
        value: 100kΩ
        footprint: Resistor_SMD:R_0402_1005Metric
      R_LATCH_G:
        symbol: Device:R
        sheet: Power_Control
        value: 10kΩ
        footprint: Resistor_SMD:R_0402_1005Metric
      C_DBNC:
        symbol: Device:C
        sheet: Power_Control
        value: 100nF
        footprint: Capacitor_SMD:C_0402_1005Metric
      SW_PWR:
        symbol: Switch:SW_Push
        sheet: Power_Control
        value: Alps_SKRTLAE010
        footprint: Button_Switch_SMD:SW_Push_1P1T-MP_NO_Horizontal_Alps_SKRTLAE010
    connections:
      - net: PWR_GATE
        pins: [Q_PWR:G, R_GATE:2, Q_LATCH:D]
      - net: PWR_LATCH_G
        pins: [Q_LATCH:G, R_LATCH_G:2, D_OR1:K, D_OR2:K]
      - net: GND
        pins: [Q_LATCH:S, R_LATCH_G:1, C_DBNC:2, SW_PWR:2]
      # PWR_BTN_NODE and PWR_BTN_SENSE are the same physical node (R_BTN_PU/
      # R_PWR_SENSE divider midpoint, also where the button pulls to GND) —
      # standardized on one label (PWR_BTN_SENSE) to avoid an ERC ambiguous-
      # net-name warning.
      - net: PWR_BTN_SENSE
        pins: [SW_PWR:1, R_BTN_PU:2, C_DBNC:1, D_OR1:A, R_PWR_SENSE:1, U_MCU:38]
      - net: GND
        pins: [R_PWR_SENSE:2]
      - net: PWR_HOLD
        pins: [D_OR2:A, U_MCU:36]

  # -------------------------------------------------------------------------
  # 6. MCU_Core: ESP32-S3-WROOM-1 module
  # -------------------------------------------------------------------------
  # Pre-certified module (integrated flash, crystal, WiFi/BT radio + PCB
  # antenna) — replaces the bare-RP2350A + external flash/crystal + Murata
  # wireless module design. No RF design, no antenna licensing, no crystal
  # load-cap calculation, no core-regulator LC filter: the module handles
  # all of that internally. Symbol/footprint from Espressif's own official
  # KiCad library (github.com/espressif/kicad-libraries), not hand-authored.
  #
  # Pins referenced by number, not name — the module's pins are heavily
  # multi-function (e.g. pin 4 is "GPIO4/TOUCH4/ADC1_CH3") and numbers are
  # unambiguous. GPIO26-32 are internally wired to the module's own flash
  # and are not present on this symbol at all; GPIO33/34 exist on the bare
  # chip but aren't broken out on the WROOM-1 module either.
  #
  # EN and GPIO0 (BOOT) both have internal weak pull-ups, but external
  # 10kΩ pull-ups are standard, reliable practice for both (matches every
  # real ESP32-S3 reference design, including Espressif's own DevKitC).
  # GPIO0 additionally gets a button to pull it low at boot, exactly like
  # the old RP2350 BOOTSEL pattern, just renamed to match ESP32 convention.
  #
  # ADC signals deliberately use ADC1-only pins (4/5/6/7) — ADC2 is
  # unusable while WiFi is active on ESP32-S3, and this design keeps WiFi
  # on.
  MCU_Core:
    components:
      U_MCU:
        symbol: Espressif:ESP32-S3-WROOM-1
        sheet: MCU_Core
        value: ESP32-S3-WROOM-1-N8
        footprint: Espressif:ESP32-S3-WROOM-1
      SW_BOOT:
        symbol: Switch:SW_Push
        sheet: MCU_Core
        value: TP-1221U-K9K5325
        footprint: Button_Switch_SMD:SW_SPST_TL3342
      R_BOOT_PU:
        symbol: Device:R
        sheet: MCU_Core
        value: 10kΩ
        footprint: Resistor_SMD:R_0402_1005Metric
      R_EN_PU:
        symbol: Device:R
        sheet: MCU_Core
        value: 10kΩ
        footprint: Resistor_SMD:R_0402_1005Metric
      R_USB_DP:
        symbol: Device:R
        sheet: MCU_Core
        value: 27Ω
        footprint: Resistor_SMD:R_0402_1005Metric
      R_USB_DM:
        symbol: Device:R
        sheet: MCU_Core
        value: 27Ω
        footprint: Resistor_SMD:R_0402_1005Metric
      C_3V3_1:
        symbol: Device:C
        sheet: MCU_Core
        value: 10µF
        footprint: Capacitor_SMD:C_0603_1608Metric
      C_3V3_2:
        symbol: Device:C
        sheet: MCU_Core
        value: 100nF
        footprint: Capacitor_SMD:C_0402_1005Metric
      R_VSYS1:
        symbol: Device:R
        sheet: MCU_Core
        value: 200kΩ
        footprint: Resistor_SMD:R_0402_1005Metric
      R_VSYS2:
        symbol: Device:R
        sheet: MCU_Core
        value: 100kΩ
        footprint: Resistor_SMD:R_0402_1005Metric
    connections:
      - net: 3V3
        pins: [U_MCU:2, R_EN_PU:2, R_BOOT_PU:2, C_3V3_1:1, C_3V3_2:1]
      - net: GND
        pins: [U_MCU:1, U_MCU:40, U_MCU:41, C_3V3_1:2, C_3V3_2:2, SW_BOOT:1]
      - net: MCU_EN
        pins: [U_MCU:3, R_EN_PU:1]
      - net: MCU_BOOT
        pins: [U_MCU:27, R_BOOT_PU:1, SW_BOOT:2]
      # USB (native — external USB-C connector via 27R series)
      - net: USB_DP_MCU
        pins: [R_USB_DP:2, U_MCU:14]
      - net: USB_DM_MCU
        pins: [R_USB_DM:2, U_MCU:13]
      # SPI - XBee
      - net: SPI_SCK
        pins: [U_MCU:18, U_XBEE:SPI_CLK]
      - net: SPI_MOSI
        pins: [U_MCU:19, U_XBEE:SPI_MOSI]
      - net: SPI_MISO
        pins: [U_MCU:20, U_XBEE:SPI_MISO]
      - net: XBee_CS
        pins: [U_MCU:21, U_XBEE:SPI_SSEL]
      - net: XBEE_ON_SLEEP
        pins: [U_MCU:22, U_XBEE:ON_SLEEP]
      - net: XBEE_SPI_ATTN
        pins: [U_MCU:8, U_XBEE:SPI_ATTN]
      # I2C - OLED
      - net: I2C_SDA
        pins: [U_MCU:12, U_OLED:SDA, R_I2C_SDA:2]
      - net: I2C_SCL
        pins: [U_MCU:17, U_OLED:SCL, R_I2C_SCL:2]
      # ADC inputs (ADC1-only, see note above)
      - net: TRIG_ANALOG
        pins: [U_MCU:4, U_HALL:OUT]
      - net: STICK_X
        pins: [U_MCU:5, J_STICK:2]
      - net: STICK_Y
        pins: [U_MCU:6, J_STICK:2']
      # Misc control
      - net: RGB_DIN
        pins: [U_MCU:37, R_RGB:2]
      # Digital buttons (internal pull-ups in firmware)
      - net: BTN_VOL_UP
        pins: [U_MCU:9, SW_VOL_UP:1]
      - net: BTN_VOL_DN
        pins: [U_MCU:10, SW_VOL_DN:1]
      - net: BTN_TRIG_DIG
        pins: [U_MCU:11, SW_TRIG_DIG:1]
      - net: BTN_STICK
        pins: [U_MCU:23, J_STICK:a]
      # Macro buttons — direct-wired, no scan matrix. ESP32-S3-WROOM-1 has
      # ample spare GPIO, unlike the bare-RP2350A design this replaced,
      # so the 1-pin savings of a 2x3 matrix isn't worth the anti-ghosting
      # diodes and scan firmware it costs.
      - net: BTN_MACRO1
        pins: [U_MCU:24, SW_MACRO1:1]
      - net: BTN_MACRO2
        pins: [U_MCU:25, SW_MACRO2:1]
      - net: BTN_MACRO3
        pins: [U_MCU:28, SW_MACRO3:1]
      - net: BTN_MACRO4
        pins: [U_MCU:29, SW_MACRO4:1]
      - net: BTN_MACRO5
        pins: [U_MCU:30, SW_MACRO5:1]
      - net: BTN_MACRO6
        pins: [U_MCU:31, SW_MACRO6:1]
      # VSYS battery-voltage sense: divide-by-3 into ADC1_CH6 (pin 7)
      - net: VSYS_SENSE
        pins: [R_VSYS1:2, R_VSYS2:1, U_MCU:7]
      - net: GND
        pins: [R_VSYS2:2]
      # Spare GPIO: 15/16/26 usable-with-care (strapping), 32-35 clean
      # (default JTAG, fully reusable as plain GPIO). See RESERVED GPIO
      # header comment for details.
      - no_connect: [U_MCU:15, U_MCU:16, U_MCU:26, U_MCU:32, U_MCU:33,
                     U_MCU:34, U_MCU:35]

  # -------------------------------------------------------------------------
  # 7. XBee3 Radio (SPI mode, THT socket)
  # -------------------------------------------------------------------------
  # THT socket for prototyping. Update footprint for SMT module on final PCB.
  # RESET: 10kΩ pull-up to 3V3 + RC filter (100Ω + 100nF) per AmidalaShield.
  # Decoupling: 100nF on VCC.
  XBee:
    components:
      U_XBEE:
        symbol: Xbee3:XB3-24Z8UT-J
        sheet: XBee
        value: XBee3
        footprint: Xbee3:XB324Z8UTJ
      C_XBEE_VCC:
        symbol: Device:C
        sheet: XBee
        value: 100nF
        footprint: Capacitor_SMD:C_0402_1005Metric
      R_XBEE_RST:
        symbol: Device:R
        sheet: XBee
        value: 10kΩ
        footprint: Resistor_SMD:R_0402_1005Metric
      R_XBEE_RC:
        symbol: Device:R
        sheet: XBee
        value: 100Ω
        footprint: Resistor_SMD:R_0402_1005Metric
      C_XBEE_RC:
        symbol: Device:C
        sheet: XBee
        value: 100nF
        footprint: Capacitor_SMD:C_0402_1005Metric
    connections:
      - net: 3V3
        pins: [U_XBEE:VCC, C_XBEE_VCC:1, R_XBEE_RST:1]
      - net: GND
        pins: [U_XBEE:GND, C_XBEE_VCC:2, C_XBEE_RC:2]
      - net: XBEE_RST_PU
        pins: [R_XBEE_RST:2, R_XBEE_RC:1, C_XBEE_RC:1]
      - net: XBEE_RESET
        pins: [U_XBEE:RESET, R_XBEE_RC:2]
      # DTR/ON_SLEEP/SPI_ATTN per Amidala's actual AmidalaShield netlist
      # (pulled from its IPC-2581 export, not guessed): DTR tied low,
      # ON_SLEEP and SPI_ATTN go to host GPIO. SPI_ATTN is the XBee's
      # data-ready interrupt line — needed for reliable SPI transfers
      # rather than polling, not just a nice-to-have.
      - net: GND
        pins: [U_XBEE:DTR]
      # Remaining auxiliary pins unused: DOUT/DIN(secondary UART),
      # RSSI_PWM, PWM1, [RESERVED]x2, CTS, ASSOCIATE, RTS, AD0
      - no_connect: [U_XBEE:2, U_XBEE:3, U_XBEE:6, U_XBEE:7, U_XBEE:8,
                     U_XBEE:12, U_XBEE:14, U_XBEE:15, U_XBEE:16, U_XBEE:20]

  # -------------------------------------------------------------------------
  # 8. SSD1306 OLED Display (1.3", 128x64, I2C)
  # -------------------------------------------------------------------------
  # I2C address: 0x3C (default). I2C pull-ups included as 4.7kΩ.
  # Mark R_I2C_SDA and R_I2C_SCL as DNP if OLED breakout has them onboard.
  # Decoupling: 10µF + 100nF on VCC.
  OLED:
    components:
      U_OLED:
        symbol: SnipsControllers:SSD1306_OLED_4pin
        sheet: OLED
        value: SSD1306_1.3in
        footprint: Display:Adafruit_SSD1306
      C_OLED_1:
        symbol: Device:C
        sheet: OLED
        value: 10µF
        footprint: Capacitor_SMD:C_0805_2012Metric
      C_OLED_2:
        symbol: Device:C
        sheet: OLED
        value: 100nF
        footprint: Capacitor_SMD:C_0402_1005Metric
      R_I2C_SDA:
        symbol: Device:R
        sheet: OLED
        value: 4.7kΩ
        footprint: Resistor_SMD:R_0402_1005Metric
        # DNP when using Adafruit #938 breakout — pull-ups already onboard
        # Populate only when using bare OLED panel on final custom PCB
      R_I2C_SCL:
        symbol: Device:R
        sheet: OLED
        value: 4.7kΩ
        footprint: Resistor_SMD:R_0402_1005Metric
        # DNP when using Adafruit #938 breakout — pull-ups already onboard
        # Populate only when using bare OLED panel on final custom PCB
    connections:
      - net: 3V3
        pins: [U_OLED:VCC, C_OLED_1:1, C_OLED_2:1, R_I2C_SDA:1, R_I2C_SCL:1]
      - net: GND
        pins: [U_OLED:GND, C_OLED_1:2, C_OLED_2:2]

  # -------------------------------------------------------------------------
  # 9. DRV5055 Analog Hall Effect Trigger Sensor
  # -------------------------------------------------------------------------
  # Ratiometric linear output, 3.3V native. A2 variant (50mV/mT).
  # Decoupling: 100nF on VCC.
  # Package: TO-92 for prototyping, SOT-23 for final PCB.
  Hall_Trigger:
    components:
      U_HALL:
        symbol: Sensor_Magnetic:DRV5055A2xLPGxQ1
        sheet: Hall_Trigger
        value: DRV5055A2
        footprint: Package_TO_SOT_THT:TO-92_Inline
      C_HALL:
        symbol: Device:C
        sheet: Hall_Trigger
        value: 100nF
        footprint: Capacitor_SMD:C_0402_1005Metric
    connections:
      - net: 3V3
        pins: [U_HALL:VCC, C_HALL:1]
      - net: GND
        pins: [U_HALL:GND, C_HALL:2]

  # -------------------------------------------------------------------------
  # 10. GuliKit Hall Effect Thumbstick
  # -------------------------------------------------------------------------
  # OEM-replacement-style hall/TMR stick (ALPS RKJXV1224 / C&K THB001P
  # footprint family) -- a 2-axis potentiometer-emulation interface, not a
  # simple VCC/GND/X/Y/SW breakout. Each axis needs its own low/wiper/high
  # connection (1/2/3 for X, 1'/2'/3' for Y); switch is pins a/c (b/d are
  # mechanically-redundant duplicate legs, intentionally unconnected).
  # Decoupling: 100nF on VCC.
  Thumbstick:
    components:
      J_STICK:
        symbol: SnipsControllers_Custom:GuliKit_HallStick
        sheet: Thumbstick
        value: GuliKit_Thumbstick
        footprint: SnipsControllers_Custom:GuliKit_HallStick
      C_STICK:
        symbol: Device:C
        sheet: Thumbstick
        value: 100nF
        footprint: Capacitor_SMD:C_0402_1005Metric
    connections:
      - net: 3V3
        pins: [J_STICK:3, J_STICK:3', C_STICK:1]
      - net: GND
        pins: [J_STICK:1, J_STICK:1', J_STICK:c, C_STICK:2]

  # -------------------------------------------------------------------------
  # 11. SK6812 RGB LED (NeoPixel-compatible)
  # -------------------------------------------------------------------------
  # SK6812 chosen over WS2812B for explicit 3.3V VDD compatibility.
  # Pin and protocol compatible with WS2812B — driven via ESP32-S3's RMT
  # peripheral (pin 37), the standard driver mechanism for this timing.
  # R_RGB: 300-500Ω series on DIN for signal integrity (standard practice).
  # Decoupling: 100nF on VCC.
  RGB_LED:
    components:
      D_RGB:
        symbol: LED:SK6812
        sheet: RGB_LED
        value: SK6812MINI-E
        footprint: LED_SMD:LED_SK6812MINI-E_3.2x2.8mm_P1.5mm_ReverseMount
      R_RGB:
        symbol: Device:R
        sheet: RGB_LED
        value: 330Ω
        footprint: Resistor_SMD:R_0402_1005Metric
      C_RGB:
        symbol: Device:C
        sheet: RGB_LED
        value: 100nF
        footprint: Capacitor_SMD:C_0402_1005Metric
    connections:
      - net: 3V3
        pins: [D_RGB:VDD, C_RGB:1]
      - net: GND
        pins: [D_RGB:VSS, C_RGB:2]
      - net: RGB_DIN_R
        pins: [R_RGB:1]
      - net: RGB_DIN_R
        pins: [D_RGB:DIN]
      # DOUT: chains to the next LED in a strip — no next LED in this design
      - no_connect: [D_RGB:DOUT]

  # -------------------------------------------------------------------------
  # 12-13. Direct Buttons (vol up/dn, digital trigger, 6 macro buttons)
  # -------------------------------------------------------------------------
  # Active low, internal pull-ups in firmware. Wire to GND.
  # Macro buttons are direct-wired here too (no 2x3 scan matrix) — see the
  # MCU_Core note on why: ESP32-S3-WROOM-1 has enough spare GPIO that the
  # matrix's 1-pin savings isn't worth the anti-ghosting diodes and scan
  # firmware it used to require.
  Buttons_Direct:
    components:
