<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-label="Top-down PCB floorplan for the TLV62569 buck stage, showing the input capacitor and IC placed in a tight loop, the inductor placed directly off the switch pin, the output capacitor next to the inductor, and the feedback divider routed on a separate quiet path back to the IC's FB pin, away from the switch-node copper.">
        <defs>
          <linearGradient id="boardGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#134127"/>
            <stop offset="1" stop-color="#0e2d1c"/>
          </linearGradient>
          <pattern id="gndhatch" width="10" height="10" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
            <rect width="10" height="10" fill="#134127"/>
            <line x1="0" y1="0" x2="0" y2="10" stroke="#1d5c39" stroke-width="2"/>
          </pattern>
          <marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L8,4 L0,8 z" fill="#c9d6cd"/>
          </marker>
        </defs>

        <rect x="30" y="50" width="840" height="470" rx="12" fill="url(#boardGrad)" stroke="#061309" stroke-width="3"/>

        <text x="52" y="82" font-family="JetBrains Mono, monospace" font-size="13" fill="#eef2ea" font-weight="600">U_BUCK1 — TLV62569 buck stage</text>
        <text x="52" y="100" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#7fa08d">top copper (F.Cu) · rings = via to GND plane (B.Cu)</text>

        <!-- ground pour legend swatch -->
        <rect x="742" y="66" width="98" height="34" rx="3" fill="url(#gndhatch)" stroke="#3a6e4f" stroke-width="1"/>
        <text x="791" y="114" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#7fa08d">GND pour, layer 2</text>

        <!-- ================= TRACES ================= -->
        <!-- VSYS -> C_IN -->
        <path d="M80,150 L352,150" fill="none" stroke="#d9a441" stroke-width="6" stroke-linecap="round"/>
        <!-- C_IN -> VIN -->
        <path d="M352,150 L352,192 L362,204 L362,232" fill="none" stroke="#d9a441" stroke-width="5" stroke-linecap="round"/>
        <!-- C_IN gnd pad -> via -->
        <path d="M372,150 L400,150" fill="none" stroke="#d9a441" stroke-width="5" stroke-linecap="round"/>
        <!-- IC GND pin -> via -->
        <path d="M340,288 L340,320" fill="none" stroke="#d9a441" stroke-width="5" stroke-linecap="round"/>
        <!-- SW -> L1 -->
        <path d="M362,288 L390,288 L412,310 L440,330" fill="none" stroke="#e0862b" stroke-width="8" stroke-linecap="round"/>
        <!-- L1 -> node -->
        <path d="M500,330 L555,330" fill="none" stroke="#d9a441" stroke-width="7" stroke-linecap="round"/>
        <!-- node -> C_OUT top pad -->
        <path d="M555,330 L560,323 L570,320" fill="none" stroke="#d9a441" stroke-width="6" stroke-linecap="round"/>
        <!-- node -> edge (3V3 out) -->
        <path d="M555,330 L818,330" fill="none" stroke="#d9a441" stroke-width="6" stroke-linecap="round"/>
        <!-- C_OUT bottom pad -> via -->
        <path d="M570,345 L570,375" fill="none" stroke="#d9a441" stroke-width="5" stroke-linecap="round"/>

        <!-- FB sense: tap at C_OUT pad -> R_FB1 -->
        <path d="M570,320 L570,362 L562,380 L555,392" fill="none" stroke="#8fd3ff" stroke-width="3" stroke-linecap="round"/>
        <!-- R_FB1 -> node -->
        <path d="M555,414 L555,424" fill="none" stroke="#8fd3ff" stroke-width="3" stroke-linecap="round"/>
        <!-- node -> R_FB2 -->
        <path d="M555,424 L555,434" fill="none" stroke="#8fd3ff" stroke-width="3" stroke-linecap="round"/>
        <!-- FB node -> long way to IC FB pin, clear of SW/L1 copper -->
        <path d="M555,424 L300,424 L280,404 L280,250 L300,232 L318,232" fill="none" stroke="#8fd3ff" stroke-width="3" stroke-linecap="round"/>
        <!-- R_FB2 -> gnd via -->
        <path d="M555,456 L555,486" fill="none" stroke="#8fd3ff" stroke-width="3" stroke-linecap="round"/>

        <!-- EN -> edge -->
        <path d="M318,288 L318,340 L290,360 L100,360" fill="none" stroke="#8fd3ff" stroke-width="3" stroke-linecap="round"/>

        <!-- ================= VIAS ================= -->
        <g>
          <circle cx="400" cy="150" r="7" fill="#cf9a4c" stroke="#061309" stroke-width="2"/><circle cx="400" cy="150" r="3" fill="#0e2d1c"/>
          <circle cx="340" cy="320" r="7" fill="#cf9a4c" stroke="#061309" stroke-width="2"/><circle cx="340" cy="320" r="3" fill="#0e2d1c"/>
          <circle cx="570" cy="375" r="7" fill="#cf9a4c" stroke="#061309" stroke-width="2"/><circle cx="570" cy="375" r="3" fill="#0e2d1c"/>
          <circle cx="555" cy="486" r="7" fill="#cf9a4c" stroke="#061309" stroke-width="2"/><circle cx="555" cy="486" r="3" fill="#0e2d1c"/>
        </g>

        <!-- ================= COMPONENTS ================= -->
        <!-- IC -->
        <rect x="300" y="232" width="80" height="56" rx="4" fill="#20241f" stroke="#4a5044" stroke-width="1.5"/>
        <circle cx="309" cy="240" r="3" fill="#eef2ea"/>
        <text x="340" y="223" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="13" fill="#e0b563">U1</text>
        <text x="340" y="304" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#7fa08d">TLV62569DBV</text>
        <rect x="311" y="284" width="14" height="8" fill="#e0b563" stroke="#8a672f"/>
        <rect x="333" y="284" width="14" height="8" fill="#e0b563" stroke="#8a672f"/>
        <rect x="355" y="284" width="14" height="8" fill="#e0b563" stroke="#8a672f"/>
        <rect x="311" y="228" width="14" height="8" fill="#e0b563" stroke="#8a672f"/>
        <rect x="355" y="228" width="14" height="8" fill="#e0b563" stroke="#8a672f"/>
        <text x="291" y="308" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="10" fill="#c9d6cd">1 EN</text>
        <text x="340" y="308" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#c9d6cd">2 GND</text>
        <text x="389" y="308" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="10" fill="#c9d6cd">3 SW</text>
        <text x="291" y="216" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="10" fill="#c9d6cd">5 FB</text>
        <text x="389" y="216" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="10" fill="#c9d6cd">4 VIN</text>

        <!-- C_IN -->
        <rect x="347" y="141" width="30" height="18" rx="2" fill="#20241f" stroke="#4a5044" stroke-width="1.5"/>
        <rect x="347" y="145" width="10" height="10" fill="#e0b563" stroke="#8a672f"/>
        <rect x="367" y="145" width="10" height="10" fill="#e0b563" stroke="#8a672f"/>
        <text x="362" y="129" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#e0b563">C_IN 10µF</text>
        <text x="416" y="154" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#7fa08d">GND</text>

        <!-- L1 -->
        <rect x="435" y="295" width="70" height="70" rx="5" fill="#33383a" stroke="#565c5f" stroke-width="1.5"/>
        <rect x="433" y="322" width="16" height="18" fill="#e0b563" stroke="#8a672f"/>
        <rect x="491" y="322" width="16" height="18" fill="#e0b563" stroke="#8a672f"/>
        <text x="470" y="284" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#e0b563">L1 · 2.2µH</text>
        <text x="470" y="380" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#7fa08d">SRN4018</text>

        <!-- C_OUT -->
        <rect x="561" y="311" width="18" height="42" rx="2" fill="#20241f" stroke="#4a5044" stroke-width="1.5"/>
        <rect x="565" y="313" width="10" height="10" fill="#e0b563" stroke="#8a672f"/>
        <rect x="565" y="339" width="10" height="10" fill="#e0b563" stroke="#8a672f"/>
        <text x="596" y="317" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#e0b563">C_OUT 22µF</text>
        <text x="586" y="379" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#7fa08d">GND</text>

        <!-- R_FB1 -->
        <rect x="548" y="390" width="14" height="26" rx="2" fill="#20241f" stroke="#4a5044" stroke-width="1.5"/>
        <rect x="550" y="390" width="10" height="8" fill="#e0b563" stroke="#8a672f"/>
        <rect x="550" y="408" width="10" height="8" fill="#e0b563" stroke="#8a672f"/>
        <text x="578" y="407" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#e0b563">R_FB1 · 255kΩ</text>

        <!-- FB node dot -->
        <circle cx="555" cy="424" r="3.5" fill="#8fd3ff"/>

        <!-- R_FB2 -->
        <rect x="548" y="432" width="14" height="26" rx="2" fill="#20241f" stroke="#4a5044" stroke-width="1.5"/>
        <rect x="550" y="432" width="10" height="8" fill="#e0b563" stroke="#8a672f"/>
        <rect x="550" y="450" width="10" height="8" fill="#e0b563" stroke="#8a672f"/>
        <text x="578" y="449" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#e0b563">R_FB2 · 56.2kΩ</text>
        <text x="586" y="497" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#7fa08d">GND</text>

        <!-- edge connectors -->
        <circle cx="80" cy="150" r="8" fill="#e0b563" stroke="#8a672f" stroke-width="1.5"/>
        <text x="80" y="132" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#eef2ea">VSYS_IN</text>

        <circle cx="80" cy="360" r="8" fill="#e0b563" stroke="#8a672f" stroke-width="1.5"/>
        <text x="80" y="342" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#eef2ea">PWR_EN</text>

        <circle cx="820" cy="330" r="8" fill="#e0b563" stroke="#8a672f" stroke-width="1.5"/>
        <text x="820" y="312" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#eef2ea">3V3_OUT</text>

        <!-- ================= CALLOUTS ================= -->
        <g font-family="JetBrains Mono, monospace">
          <line x1="420" y1="118" x2="357" y2="188" stroke="#c9d6cd" stroke-width="1" stroke-dasharray="3,3" opacity="0.65"/>
          <circle cx="420" cy="110" r="12" fill="#ff8a3d"/>
          <text x="420" y="114.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#231205">A</text>

          <line x1="402" y1="263" x2="414" y2="303" stroke="#c9d6cd" stroke-width="1" stroke-dasharray="3,3" opacity="0.65"/>
          <circle cx="402" cy="255" r="12" fill="#ff8a3d"/>
          <text x="402" y="259.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#231205">B</text>

          <line x1="612" y1="304" x2="571" y2="322" stroke="#c9d6cd" stroke-width="1" stroke-dasharray="3,3" opacity="0.65"/>
          <circle cx="622" cy="300" r="12" fill="#ff8a3d"/>
          <text x="622" y="304.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#231205">C</text>

          <line x1="262" y1="333" x2="336" y2="322" stroke="#c9d6cd" stroke-width="1" stroke-dasharray="3,3" opacity="0.65"/>
          <circle cx="250" cy="335" r="12" fill="#ff8a3d"/>
          <text x="250" y="339.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#231205">D</text>

          <line x1="212" y1="415" x2="277" y2="352" stroke="#c9d6cd" stroke-width="1" stroke-dasharray="3,3" opacity="0.65"/>
          <circle cx="200" cy="422" r="12" fill="#ff8a3d"/>
          <text x="200" y="426.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#231205">E</text>
        </g>
      </svg>
