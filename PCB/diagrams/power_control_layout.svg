<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="610" viewBox="0 0 900 610" role="img" aria-label="Top-down PCB floorplan for the soft-latch power switch, showing VSYS entering the PMOS source and exiting the drain as PWR_EN in one straight lane across the top, the NMOS latch and diode-OR logic clustered in a compact low-current block beneath it, and the physical power button placed near the board edge with its debounce capacitor right at its pins.">
        <defs>
          <linearGradient id="boardGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#134127"/>
            <stop offset="1" stop-color="#0e2d1c"/>
          </linearGradient>
          <pattern id="gndhatch" width="10" height="10" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
            <rect width="10" height="10" fill="#134127"/>
            <line x1="0" y1="0" x2="0" y2="10" stroke="#1d5c39" stroke-width="2"/>
          </pattern>
        </defs>

        <rect x="30" y="50" width="840" height="520" rx="12" fill="url(#boardGrad)" stroke="#061309" stroke-width="3"/>

        <text x="52" y="82" font-family="JetBrains Mono, monospace" font-size="13" fill="#eef2ea" font-weight="600">Power_Control — soft-latch switch</text>
        <text x="52" y="100" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#7fa08d">top copper (F.Cu) · rings = via to GND plane (B.Cu)</text>

        <rect x="742" y="66" width="98" height="34" rx="3" fill="url(#gndhatch)" stroke="#3a6e4f" stroke-width="1"/>
        <text x="791" y="114" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#7fa08d">GND pour, layer 2</text>

        <!-- ================= TRACES ================= -->
        <!-- main VSYS -> Q_PWR -> PWR_EN lane -->
        <path d="M80,155 L216,155" fill="none" stroke="#d9a441" stroke-width="9" stroke-linecap="round"/>
        <path d="M264,155 L820,155" fill="none" stroke="#d9a441" stroke-width="9" stroke-linecap="round"/>

        <!-- VSYS tap -> R_GATE -->
        <path d="M210,155 L210,190" fill="none" stroke="#d9a441" stroke-width="4" stroke-linecap="round"/>
        <!-- R_GATE bottom (PWR_GATE) -> Q_LATCH drain, and Q_PWR gate -> same node -->
        <path d="M210,229 L210,255" fill="none" stroke="#8fd3ff" stroke-width="3" stroke-linecap="round"/>
        <path d="M240,175 L240,215 L225,229 L210,229" fill="none" stroke="#8fd3ff" stroke-width="3" stroke-linecap="round"/>
        <circle cx="210" cy="229" r="3.5" fill="#8fd3ff"/>

        <!-- Q_LATCH source -> GND via -->
        <path d="M210,295 L210,320" fill="none" stroke="#8fd3ff" stroke-width="3" stroke-linecap="round"/>
        <!-- Q_LATCH gate -> OR junction -->
        <path d="M230,275 L300,275 L320,300 L340,320" fill="none" stroke="#8fd3ff" stroke-width="3" stroke-linecap="round"/>
        <circle cx="340" cy="320" r="4" fill="#8fd3ff"/>

        <!-- R_LATCH_G -->
        <path d="M340,320 L340,341" fill="none" stroke="#8fd3ff" stroke-width="3" stroke-linecap="round"/>
        <path d="M340,369 L340,395" fill="none" stroke="#8fd3ff" stroke-width="3" stroke-linecap="round"/>

        <!-- D_OR1 cathode -> junction, anode -> bus -->
        <path d="M375,376 L365,350 L340,320" fill="none" stroke="#8fd3ff" stroke-width="3" stroke-linecap="round"/>
        <path d="M375,404 L375,422" fill="none" stroke="#8fd3ff" stroke-width="3" stroke-linecap="round"/>

        <!-- D_OR2 cathode -> junction, anode -> PWR_HOLD edge -->
        <path d="M400,284 L380,300 L340,320" fill="none" stroke="#8fd3ff" stroke-width="3" stroke-linecap="round"/>
        <path d="M400,256 L400,220 L820,220" fill="none" stroke="#8fd3ff" stroke-width="3" stroke-linecap="round"/>

        <!-- PWR_BTN_SENSE bus -->
        <path d="M125,455 L820,455" fill="none" stroke="#8fd3ff" stroke-width="3" stroke-linecap="round"/>
        <path d="M125,495 L125,455" fill="none" stroke="#8fd3ff" stroke-width="3" stroke-linecap="round"/>
        <path d="M175,495 L175,518" fill="none" stroke="#8fd3ff" stroke-width="3" stroke-linecap="round"/>
        <path d="M210,455 L210,472" fill="none" stroke="#8fd3ff" stroke-width="3" stroke-linecap="round"/>
        <path d="M210,484 L210,505" fill="none" stroke="#8fd3ff" stroke-width="3" stroke-linecap="round"/>
        <path d="M280,406 L280,390" fill="none" stroke="#8fd3ff" stroke-width="3" stroke-linecap="round"/>
        <path d="M280,434 L280,455" fill="none" stroke="#8fd3ff" stroke-width="3" stroke-linecap="round"/>
        <path d="M340,455 L340,472" fill="none" stroke="#8fd3ff" stroke-width="3" stroke-linecap="round"/>
        <path d="M340,484 L340,505" fill="none" stroke="#8fd3ff" stroke-width="3" stroke-linecap="round"/>

        <!-- ================= VIAS ================= -->
        <g>
          <circle cx="210" cy="320" r="6" fill="#cf9a4c" stroke="#061309" stroke-width="2"/><circle cx="210" cy="320" r="2.5" fill="#0e2d1c"/>
          <circle cx="340" cy="395" r="6" fill="#cf9a4c" stroke="#061309" stroke-width="2"/><circle cx="340" cy="395" r="2.5" fill="#0e2d1c"/>
          <circle cx="175" cy="518" r="6" fill="#cf9a4c" stroke="#061309" stroke-width="2"/><circle cx="175" cy="518" r="2.5" fill="#0e2d1c"/>
          <circle cx="210" cy="505" r="6" fill="#cf9a4c" stroke="#061309" stroke-width="2"/><circle cx="210" cy="505" r="2.5" fill="#0e2d1c"/>
          <circle cx="340" cy="505" r="6" fill="#cf9a4c" stroke="#061309" stroke-width="2"/><circle cx="340" cy="505" r="2.5" fill="#0e2d1c"/>
          <circle cx="340" cy="562" r="6" fill="#cf9a4c" stroke="#061309" stroke-width="2"/><circle cx="340" cy="562" r="2.5" fill="#0e2d1c"/>
          <circle cx="307" cy="218" r="6" fill="#cf9a4c" stroke="#061309" stroke-width="2"/><circle cx="307" cy="218" r="2.5" fill="#0e2d1c"/>
        </g>

        <!-- R_PWR_EN_PD1: PWR_EN has no internal bias in the buck's EN pin
             (datasheet says don't leave floating) - this holds it at GND
             the instant Q_PWR1 turns off (see callout G) -->
        <path d="M307,155 L307,175" fill="none" stroke="#8fd3ff" stroke-width="3" stroke-linecap="round"/>
        <path d="M307,201 L307,218" fill="none" stroke="#8fd3ff" stroke-width="3" stroke-linecap="round"/>
        <rect x="300" y="175" width="14" height="26" rx="2" fill="#20241f" stroke="#4a5044" stroke-width="1.5"/>
        <text x="319" y="191" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#8fd3ff">R_PWR_EN_PD1 100k</text>

        <!-- ================= COMPONENTS ================= -->
        <!-- Q_PWR1 -->
        <rect x="210" y="135" width="60" height="40" rx="4" fill="#20241f" stroke="#4a5044" stroke-width="1.5"/>
        <text x="240" y="127" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="12" fill="#e0b563">Q_PWR1</text>
        <text x="240" y="196" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#7fa08d">DMG2305UX (PMOS)</text>
        <rect x="209" y="151" width="14" height="8" fill="#e0b563" stroke="#8a672f"/>
        <rect x="257" y="151" width="14" height="8" fill="#e0b563" stroke="#8a672f"/>
        <rect x="233" y="171" width="14" height="8" fill="#e0b563" stroke="#8a672f"/>
        <text x="216" y="149" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#20241f" font-weight="600">S</text>
        <text x="264" y="149" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#20241f" font-weight="600">D</text>
        <text x="240" y="184" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#20241f" font-weight="600">G</text>

        <!-- R_GATE1 -->
        <rect x="203" y="192" width="14" height="24" rx="2" fill="#20241f" stroke="#4a5044" stroke-width="1.5"/>
        <text x="185" y="182" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="10" fill="#e0b563">VSYS</text>
        <text x="222" y="207" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#8fd3ff">R_GATE1 100k</text>

        <!-- Q_LATCH1 -->
        <rect x="195" y="250" width="30" height="50" rx="4" fill="#20241f" stroke="#4a5044" stroke-width="1.5"/>
        <text x="210" y="243" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="11" fill="#e0b563">Q_LATCH1</text>
        <text x="210" y="315" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#7fa08d">2N7002 (NMOS)</text>
        <text x="238" y="279" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="9" fill="#c9d6cd">G</text>

        <!-- R_LATCH_G1 -->
        <rect x="333" y="343" width="14" height="26" rx="2" fill="#20241f" stroke="#4a5044" stroke-width="1.5"/>
        <text x="352" y="360" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#8fd3ff">R_LATCH_G1 1M</text>

        <!-- D_OR1 -->
        <rect x="368" y="376" width="14" height="28" rx="2" fill="#20241f" stroke="#4a5044" stroke-width="1.5"/>
        <text x="386" y="395" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#8fd3ff">D_OR1 (from inverter)</text>
        <text x="386" y="422" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#c9d6cd">PWR_BTN_TRIGGER</text>

        <!-- D_OR2 -->
        <rect x="393" y="256" width="14" height="28" rx="2" fill="#20241f" stroke="#4a5044" stroke-width="1.5"/>
        <text x="411" y="264" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#8fd3ff">D_OR2 (from MCU hold)</text>
        <text x="340" y="308" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#c9d6cd">PWR_LATCH_G</text>

        <!-- switch cluster -->
        <rect x="120" y="480" width="60" height="30" rx="4" fill="#20241f" stroke="#4a5044" stroke-width="1.5"/>
        <circle cx="150" cy="495" r="9" fill="#33383a" stroke="#cf9a4c" stroke-width="1.5"/>
        <text x="150" y="472" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="11" fill="#e0b563">SW_PWR1</text>
        <rect x="119" y="491" width="10" height="8" fill="#e0b563" stroke="#8a672f"/>
        <rect x="171" y="491" width="10" height="8" fill="#e0b563" stroke="#8a672f"/>

        <!-- C_DBNC1 -->
        <rect x="203" y="470" width="14" height="16" rx="2" fill="#20241f" stroke="#4a5044" stroke-width="1.5"/>
        <text x="185" y="481" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#8fd3ff">C_DBNC1</text>

        <!-- R_BTN_PU1 -->
        <rect x="273" y="408" width="14" height="26" rx="2" fill="#20241f" stroke="#4a5044" stroke-width="1.5"/>
        <text x="262" y="382" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#e0b563">VSYS</text>
        <text x="292" y="425" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#8fd3ff">R_BTN_PU1 100k</text>

        <!-- D_INV_ISO1: isolates Q_INV1's base pull-up from PWR_BTN_SENSE so
             the inverter no longer loads the MCU's own button-sense node
             (see callout F) -->
        <rect x="333" y="472" width="14" height="16" rx="2" fill="#20241f" stroke="#4a5044" stroke-width="1.5"/>
        <text x="352" y="483" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#8fd3ff">D_INV_ISO1 (BAT54W)</text>

        <path d="M340,488 L340,505" fill="none" stroke="#8fd3ff" stroke-width="3" stroke-linecap="round"/>

        <rect x="325" y="505" width="30" height="40" rx="4" fill="#20241f" stroke="#4a5044" stroke-width="1.5"/>
        <text x="340" y="498" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="11" fill="#e0b563">Q_INV1</text>
        <text x="340" y="558" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#7fa08d">MMBT3904 (NPN)</text>
        <text x="330" y="516" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#c9d6cd">B</text>
        <text x="340" y="540" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#c9d6cd">E</text>
        <text x="353" y="519" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#c9d6cd">C</text>

        <!-- R_INV_BASE1: now its own dedicated VSYS pull-up for Q_INV1's
             base, decoupled from PWR_BTN_SENSE (mirrors R_INV_PU1 on the
             collector side) -->
        <circle cx="273" cy="522" r="3.5" fill="#8fd3ff"/>
        <path d="M325,522 L273,522 L273,531" fill="none" stroke="#8fd3ff" stroke-width="3" stroke-linecap="round"/>
        <rect x="266" y="505" width="14" height="26" rx="2" fill="#20241f" stroke="#4a5044" stroke-width="1.5"/>
        <text x="273" y="497" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#e0b563">VSYS</text>
        <text x="261" y="512" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#8fd3ff">R_INV_BASE1 100k</text>

        <path d="M340,545 L340,562" fill="none" stroke="#8fd3ff" stroke-width="3" stroke-linecap="round"/>
        <path d="M355,522 L407,522 L407,531" fill="none" stroke="#8fd3ff" stroke-width="3" stroke-linecap="round"/>
        <circle cx="407" cy="522" r="3.5" fill="#8fd3ff"/>

        <rect x="400" y="505" width="14" height="26" rx="2" fill="#20241f" stroke="#4a5044" stroke-width="1.5"/>
        <text x="407" y="497" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#e0b563">VSYS</text>
        <text x="419" y="512" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#8fd3ff">R_INV_PU1 100k</text>
        <text x="415" y="533" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#c9d6cd">PWR_BTN_TRIGGER</text>

        <text x="450" y="447" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#c9d6cd">PWR_BTN_SENSE</text>

        <!-- edge connectors -->
        <circle cx="80" cy="155" r="8" fill="#e0b563" stroke="#8a672f" stroke-width="1.5"/>
        <text x="80" y="137" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#eef2ea">VSYS_IN</text>

        <circle cx="820" cy="155" r="8" fill="#e0b563" stroke="#8a672f" stroke-width="1.5"/>
        <text x="820" y="137" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#eef2ea">PWR_EN → BUCK VIN</text>

        <circle cx="820" cy="220" r="8" fill="#8fd3ff" stroke="#4a80a0" stroke-width="1.5"/>
        <text x="820" y="202" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#eef2ea">← MCU pin 36 (PWR_HOLD)</text>

        <circle cx="820" cy="455" r="8" fill="#8fd3ff" stroke="#4a80a0" stroke-width="1.5"/>
        <text x="820" y="437" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#eef2ea">→ MCU pin 38 (ADC)</text>

        <!-- ================= CALLOUTS ================= -->
        <g font-family="JetBrains Mono, monospace">
          <line x1="140" y1="115" x2="220" y2="145" stroke="#c9d6cd" stroke-width="1" stroke-dasharray="3,3" opacity="0.65"/>
          <circle cx="130" cy="108" r="12" fill="#ff8a3d"/>
          <text x="130" y="112.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#231205">A</text>

          <line x1="95" y1="450" x2="140" y2="485" stroke="#c9d6cd" stroke-width="1" stroke-dasharray="3,3" opacity="0.65"/>
          <circle cx="85" cy="440" r="12" fill="#ff8a3d"/>
          <text x="85" y="444.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#231205">B</text>

          <line x1="245" y1="440" x2="212" y2="478" stroke="#c9d6cd" stroke-width="1" stroke-dasharray="3,3" opacity="0.65"/>
          <circle cx="255" cy="435" r="12" fill="#ff8a3d"/>
          <text x="255" y="439.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#231205">C</text>

          <line x1="455" y1="330" x2="405" y2="320" stroke="#c9d6cd" stroke-width="1" stroke-dasharray="3,3" opacity="0.65"/>
          <circle cx="467" cy="332" r="12" fill="#ff8a3d"/>
          <text x="467" y="336.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#231205">D</text>

          <line x1="700" y1="200" x2="700" y2="220" stroke="#c9d6cd" stroke-width="1" stroke-dasharray="3,3" opacity="0.65"/>
          <circle cx="700" cy="190" r="12" fill="#ff8a3d"/>
          <text x="700" y="194.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#231205">E</text>

          <line x1="270" y1="530" x2="328" y2="518" stroke="#c9d6cd" stroke-width="1" stroke-dasharray="3,3" opacity="0.65"/>
          <circle cx="258" cy="536" r="12" fill="#ff8a3d"/>
          <text x="258" y="540.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#231205">F</text>

          <line x1="420" y1="200" x2="360" y2="188" stroke="#c9d6cd" stroke-width="1" stroke-dasharray="3,3" opacity="0.65"/>
          <circle cx="432" cy="203" r="12" fill="#ff8a3d"/>
          <text x="432" y="207.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#231205">G</text>
        </g>
      </svg>
