<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-label="Top-down PCB floorplan for the BQ25185 linear charger, showing VBUS entering the IN pin on the right, VSYS and VBAT exiting the SYS/BAT pins on the left, decoupling capacitors placed directly at each of those three pins, the ISET/VSET/TS setting resistors clustered tightly on the analog side, and a via array under the center thermal pad tying it to the ground plane.">
        <defs>
          <linearGradient id="boardGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#134127"/>
            <stop offset="1" stop-color="#0e2d1c"/>
          </linearGradient>
          <pattern id="gndhatch" width="10" height="10" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
            <rect width="10" height="10" fill="#134127"/>
            <line x1="0" y1="0" x2="0" y2="10" stroke="#1d5c39" stroke-width="2"/>
          </pattern>
        </defs>

        <rect x="30" y="50" width="840" height="470" rx="12" fill="url(#boardGrad)" stroke="#061309" stroke-width="3"/>

        <text x="52" y="82" font-family="JetBrains Mono, monospace" font-size="13" fill="#eef2ea" font-weight="600">U_CHG1 — BQ25185 linear charger</text>
        <text x="52" y="100" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#7fa08d">top copper (F.Cu) · rings = via to GND plane (B.Cu)</text>

        <rect x="742" y="66" width="98" height="34" rx="3" fill="url(#gndhatch)" stroke="#3a6e4f" stroke-width="1"/>
        <text x="791" y="114" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#7fa08d">GND pour, layer 2</text>

        <!-- ================= TRACES ================= -->
        <!-- VBUS edge -> C_VIN_1 -> C_VIN_2 -> IN pin -->
        <path d="M820,190 L560,190" fill="none" stroke="#d9a441" stroke-width="7" stroke-linecap="round"/>
        <path d="M540,190 L510,190" fill="none" stroke="#d9a441" stroke-width="7" stroke-linecap="round"/>
        <path d="M490,190 L445,190 L437,198 L435,210 L435,228" fill="none" stroke="#d9a441" stroke-width="7" stroke-linecap="round"/>
        <!-- C_VIN caps' gnd pads -> vias -->
        <path d="M550,200 L550,225" fill="none" stroke="#d9a441" stroke-width="4" stroke-linecap="round"/>
        <path d="M500,200 L500,222" fill="none" stroke="#d9a441" stroke-width="4" stroke-linecap="round"/>

        <!-- VSYS edge <- C_SYS_1 <- C_SYS_2 <- SYS pin -->
        <path d="M80,190 L240,190" fill="none" stroke="#d9a441" stroke-width="7" stroke-linecap="round"/>
        <path d="M260,190 L290,190" fill="none" stroke="#d9a441" stroke-width="7" stroke-linecap="round"/>
        <path d="M310,190 L353,190 L361,198 L365,210 L365,228" fill="none" stroke="#d9a441" stroke-width="7" stroke-linecap="round"/>
        <path d="M250,200 L250,225" fill="none" stroke="#d9a441" stroke-width="4" stroke-linecap="round"/>
        <path d="M300,200 L300,222" fill="none" stroke="#d9a441" stroke-width="4" stroke-linecap="round"/>

        <!-- BAT edge <- C_BAT1 <- BAT pin -->
        <path d="M80,340 L80,254 L230,254" fill="none" stroke="#d9a441" stroke-width="7" stroke-linecap="round"/>
        <path d="M290,254 L365,254" fill="none" stroke="#d9a441" stroke-width="7" stroke-linecap="round"/>
        <path d="M260,264 L260,289" fill="none" stroke="#d9a441" stroke-width="4" stroke-linecap="round"/>

        <!-- CE pin -> gnd via, GND pin -> gnd via, right at the package -->
        <path d="M365,306 L332,306" fill="none" stroke="#d9a441" stroke-width="4" stroke-linecap="round"/>
        <path d="M365,332 L332,332" fill="none" stroke="#d9a441" stroke-width="4" stroke-linecap="round"/>

        <!-- STAT1 pull-up + trace off to MCU -->
        <path d="M435,254 L500,254" fill="none" stroke="#8fd3ff" stroke-width="3" stroke-linecap="round"/>
        <path d="M540,254 L560,254 L820,254" fill="none" stroke="#8fd3ff" stroke-width="3" stroke-linecap="round"/>
        <path d="M520,241 L520,225" fill="none" stroke="#8fd3ff" stroke-width="3" stroke-linecap="round"/>

        <!-- ISET -->
        <path d="M435,280 L500,280" fill="none" stroke="#8fd3ff" stroke-width="3" stroke-linecap="round"/>
        <path d="M520,293 L520,318" fill="none" stroke="#8fd3ff" stroke-width="3" stroke-linecap="round"/>

        <!-- ILIM/VSET -->
        <path d="M435,306 L465,306 L500,306" fill="none" stroke="#8fd3ff" stroke-width="3" stroke-linecap="round"/>
        <path d="M520,319 L520,344" fill="none" stroke="#8fd3ff" stroke-width="3" stroke-linecap="round"/>

        <!-- TS/MR -->
        <path d="M435,332 L500,332" fill="none" stroke="#8fd3ff" stroke-width="3" stroke-linecap="round"/>
        <path d="M520,345 L520,370" fill="none" stroke="#8fd3ff" stroke-width="3" stroke-linecap="round"/>

        <!-- ================= VIAS ================= -->
        <g>
          <circle cx="550" cy="230" r="6" fill="#cf9a4c" stroke="#061309" stroke-width="2"/><circle cx="550" cy="230" r="2.5" fill="#0e2d1c"/>
          <circle cx="500" cy="227" r="6" fill="#cf9a4c" stroke="#061309" stroke-width="2"/><circle cx="500" cy="227" r="2.5" fill="#0e2d1c"/>
          <circle cx="250" cy="230" r="6" fill="#cf9a4c" stroke="#061309" stroke-width="2"/><circle cx="250" cy="230" r="2.5" fill="#0e2d1c"/>
          <circle cx="300" cy="227" r="6" fill="#cf9a4c" stroke="#061309" stroke-width="2"/><circle cx="300" cy="227" r="2.5" fill="#0e2d1c"/>
          <circle cx="260" cy="294" r="6" fill="#cf9a4c" stroke="#061309" stroke-width="2"/><circle cx="260" cy="294" r="2.5" fill="#0e2d1c"/>
          <circle cx="315" cy="306" r="6" fill="#cf9a4c" stroke="#061309" stroke-width="2"/><circle cx="315" cy="306" r="2.5" fill="#0e2d1c"/>
          <circle cx="315" cy="332" r="6" fill="#cf9a4c" stroke="#061309" stroke-width="2"/><circle cx="315" cy="332" r="2.5" fill="#0e2d1c"/>
          <circle cx="520" cy="323" r="6" fill="#cf9a4c" stroke="#061309" stroke-width="2"/><circle cx="520" cy="323" r="2.5" fill="#0e2d1c"/>
          <circle cx="520" cy="349" r="6" fill="#cf9a4c" stroke="#061309" stroke-width="2"/><circle cx="520" cy="349" r="2.5" fill="#0e2d1c"/>
          <circle cx="520" cy="375" r="6" fill="#cf9a4c" stroke="#061309" stroke-width="2"/><circle cx="520" cy="375" r="2.5" fill="#0e2d1c"/>
        </g>

        <!-- ================= IC BODY ================= -->
        <rect x="365" y="215" width="70" height="130" rx="4" fill="#20241f" stroke="#4a5044" stroke-width="1.5"/>
        <circle cx="373" cy="223" r="3" fill="#eef2ea"/>
        <text x="400" y="206" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="13" fill="#e0b563">U1</text>
        <text x="400" y="360" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#7fa08d">BQ25185DLHR (WSON-10)</text>

        <!-- thermal pad + via array -->
        <rect x="386" y="238" width="28" height="84" rx="2" fill="#3a4038" stroke="#cf9a4c" stroke-width="1" stroke-dasharray="3,2"/>
        <g fill="#cf9a4c">
          <circle cx="394" cy="252" r="3"/><circle cx="406" cy="252" r="3"/>
          <circle cx="394" cy="280" r="3"/><circle cx="406" cy="280" r="3"/>
          <circle cx="394" cy="308" r="3"/><circle cx="406" cy="308" r="3"/>
        </g>
        <text x="400" y="330" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#20241f" font-weight="600">6x THERMAL VIA</text>

        <!-- left pins -->
        <rect x="357" y="224" width="14" height="8" fill="#e0b563" stroke="#8a672f"/>
        <rect x="357" y="250" width="14" height="8" fill="#e0b563" stroke="#8a672f"/>
        <rect x="357" y="276" width="14" height="8" fill="#e0b563" stroke="#8a672f"/>
        <rect x="357" y="302" width="14" height="8" fill="#e0b563" stroke="#8a672f"/>
        <rect x="357" y="328" width="14" height="8" fill="#e0b563" stroke="#8a672f"/>
        <text x="349" y="231" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="10" fill="#c9d6cd">1 SYS</text>
        <text x="349" y="257" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="10" fill="#c9d6cd">2 BAT</text>
        <text x="349" y="283" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="10" fill="#5a6a5f">3 STAT2 (NC)</text>
        <text x="349" y="309" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="10" fill="#c9d6cd">4 /CE</text>
        <text x="349" y="335" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="10" fill="#c9d6cd">5 GND</text>

        <!-- right pins -->
        <rect x="429" y="224" width="14" height="8" fill="#e0b563" stroke="#8a672f"/>
        <rect x="429" y="250" width="14" height="8" fill="#e0b563" stroke="#8a672f"/>
        <rect x="429" y="276" width="14" height="8" fill="#e0b563" stroke="#8a672f"/>
        <rect x="429" y="302" width="14" height="8" fill="#e0b563" stroke="#8a672f"/>
        <rect x="429" y="328" width="14" height="8" fill="#e0b563" stroke="#8a672f"/>
        <text x="451" y="231" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="10" fill="#c9d6cd">10 IN</text>
        <text x="451" y="257" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="10" fill="#c9d6cd">9 STAT1</text>
        <text x="451" y="283" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="10" fill="#c9d6cd">8 ISET</text>
        <text x="451" y="309" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="10" fill="#c9d6cd">7 ILIM/VSET</text>
        <text x="451" y="335" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="10" fill="#c9d6cd">6 TS/MR</text>

        <!-- ================= COMPONENTS ================= -->
        <!-- C_VIN_1 (10uF) / C_VIN_2 (100nF) -->
        <rect x="535" y="181" width="30" height="18" rx="2" fill="#20241f" stroke="#4a5044" stroke-width="1.5"/>
        <text x="550" y="169" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#e0b563">C_VIN1 10µF</text>
        <rect x="485" y="181" width="30" height="18" rx="2" fill="#20241f" stroke="#4a5044" stroke-width="1.5"/>
        <text x="500" y="169" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#e0b563">C_VIN2 100n</text>

        <!-- C_SYS_1 (10uF) / C_SYS_2 (100nF) -->
        <rect x="235" y="181" width="30" height="18" rx="2" fill="#20241f" stroke="#4a5044" stroke-width="1.5"/>
        <text x="250" y="169" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#e0b563">C_SYS1 10µF</text>
        <rect x="285" y="181" width="30" height="18" rx="2" fill="#20241f" stroke="#4a5044" stroke-width="1.5"/>
        <text x="300" y="169" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#e0b563">C_SYS2 100n</text>

        <!-- C_BAT1 -->
        <rect x="230" y="245" width="30" height="18" rx="2" fill="#20241f" stroke="#4a5044" stroke-width="1.5"/>
        <text x="245" y="238" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#e0b563">C_BAT1 10µF</text>

        <!-- R_STAT1 -->
        <rect x="503" y="212" width="34" height="13" rx="2" fill="#20241f" stroke="#4a5044" stroke-width="1.5"/>
        <text x="520" y="208" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#8fd3ff">R_STAT1 10k → 3V3</text>

        <!-- R_ISET1 -->
        <rect x="503" y="318" width="34" height="13" rx="2" fill="#20241f" stroke="#4a5044" stroke-width="1.5"/>
        <text x="520" y="341" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#8fd3ff">R_ISET1 600Ω</text>

        <!-- R_VSET1 -->
        <rect x="503" y="344" width="34" height="13" rx="2" fill="#20241f" stroke="#4a5044" stroke-width="1.5"/>
        <text x="520" y="367" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#8fd3ff">R_VSET1 18k</text>

        <!-- R_TS1 -->
        <rect x="503" y="370" width="34" height="13" rx="2" fill="#20241f" stroke="#4a5044" stroke-width="1.5"/>
        <text x="520" y="393" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#8fd3ff">R_TS1 10k</text>

        <!-- edge connectors -->
        <circle cx="820" cy="190" r="8" fill="#e0b563" stroke="#8a672f" stroke-width="1.5"/>
        <text x="820" y="172" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#eef2ea">VBUS_IN</text>

        <circle cx="80" cy="190" r="8" fill="#e0b563" stroke="#8a672f" stroke-width="1.5"/>
        <text x="80" y="172" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#eef2ea">VSYS_OUT</text>

        <circle cx="80" cy="340" r="8" fill="#e0b563" stroke="#8a672f" stroke-width="1.5"/>
        <text x="80" y="360" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#eef2ea">VBAT</text>

        <circle cx="820" cy="254" r="8" fill="#8fd3ff" stroke="#4a80a0" stroke-width="1.5"/>
        <text x="820" y="236" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#eef2ea">STAT1 → MCU</text>

        <!-- ================= CALLOUTS ================= -->
        <g font-family="JetBrains Mono, monospace">
          <line x1="400" y1="180" x2="400" y2="235" stroke="#c9d6cd" stroke-width="1" stroke-dasharray="3,3" opacity="0.65"/>
          <circle cx="400" cy="170" r="12" fill="#ff8a3d"/>
          <text x="400" y="174.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#231205">A</text>

          <line x1="248" y1="440" x2="250" y2="205" stroke="#c9d6cd" stroke-width="1" stroke-dasharray="3,3" opacity="0.65"/>
          <circle cx="248" cy="450" r="12" fill="#ff8a3d"/>
          <text x="248" y="454.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#231205">B</text>

          <line x1="650" y1="150" x2="650" y2="190" stroke="#c9d6cd" stroke-width="1" stroke-dasharray="3,3" opacity="0.65"/>
          <circle cx="650" cy="140" r="12" fill="#ff8a3d"/>
          <text x="650" y="144.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#231205">C</text>

          <line x1="620" y1="330" x2="537" y2="325" stroke="#c9d6cd" stroke-width="1" stroke-dasharray="3,3" opacity="0.65"/>
          <circle cx="632" cy="330" r="12" fill="#ff8a3d"/>
          <text x="632" y="334.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#231205">D</text>

          <line x1="150" y1="440" x2="260" y2="300" stroke="#c9d6cd" stroke-width="1" stroke-dasharray="3,3" opacity="0.65"/>
          <circle cx="150" cy="450" r="12" fill="#ff8a3d"/>
          <text x="150" y="454.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#231205">E</text>
        </g>
      </svg>
